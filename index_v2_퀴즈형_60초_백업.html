<body>
<div id="loading">🕵️ 건축 탐정단 준비 중...</div>
<div id="game"></div>
<script id="gamecode">
'use strict';
/* =====================================================================
   ① 설정값 : 색상, 스테이지별 출제 규칙, 피드백 문구
   ===================================================================== */
const FONT = '"Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const C = {
  ink: 0x26324d, inkS: '#26324d', red: 0xE8453C, redD: 0xa3231c, blue: 0x2F7BF6, blueD: 0x1446a8,
  orange: 0xff8c1a, yellow: 0xffd84d, green: 0x2bb673, mint: 0xa8f0d8, glass: 0xe9f7ff,
  gridLine: 0x9cc7e0, gray: 0x7a8499,
};
const LABELS = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ'];
const EDGE_NAMES = ['ㄱㄴ', 'ㄴㄷ', 'ㄷㄹ', 'ㄹㄱ'];
const PAIR_EDGES = [[0, 2], [1, 3]];            // 쌍0: 변ㄱㄴ·변ㄷㄹ, 쌍1: 변ㄴㄷ·변ㄹㄱ
const PAIR_NAMES = ['변 ㄱㄴ과 변 ㄹㄷ', '변 ㄴㄷ과 변 ㄱㄹ'];
const EDGE_DIR = [[0, 1], [1, 2], [3, 2], [0, 3]]; // 평행 기호 화살표 방향을 맞추기 위한 꼭짓점 순서

const TYPE_INFO = {
  PARA:      { name: '평행사변형',        real: true,  pairs: 2 },
  RECT:      { name: '직사각형',          real: true,  pairs: 2 },
  SQUARE:    { name: '정사각형',          real: true,  pairs: 2 },
  RHOMBUS:   { name: '마름모',            real: true,  pairs: 2 },
  TRAP:      { name: '사다리꼴',          real: false, pairs: 1 },
  ISO_TRAP:  { name: '등변사다리꼴',      real: false, pairs: 1 },
  KITE:      { name: '연꼴',              real: false, pairs: 0 },
  QUAD:      { name: '일반 사각형',       real: false, pairs: 0 },
  NEAR_PARA: { name: '‘거의’ 평행사변형', real: false, pairs: -1 },
};

const STAGES = [
  { no: 1, name: '창문 공장', icon: '🏠', point: '평행한 변 찾기 연습', grid: true, mustMark: true, rotate: 'none', timer: 0,
    questions: () => shuffle(['PARA', 'PARA', 'PARA', 'QUAD', 'QUAD']), obvious: true,
    boss: { n: 6, fakeCount: 2, fakes: ['QUAD'], reals: ['PARA'] },
    intro: '첫 번째 건물, 창문 공장이에요! 모눈 칸을 세어 보면 도움이 돼요.' },
  { no: 2, name: '아파트 외벽', icon: '🏢', point: '한 쌍 vs 두 쌍', grid: true, mustMark: true, rotate: 'none', timer: 0,
    questions: () => shuffle(['PARA', 'PARA', 'TRAP', 'TRAP', pick(['PARA', 'TRAP'])]),
    boss: { n: 7, fakeCount: 2, fakes: ['TRAP'], reals: ['PARA'] },
    intro: '평행한 변이 한 쌍뿐인지, 두 쌍인지 꼭 세어 보세요!' },
  { no: 3, name: '회전 타워', icon: '🌀', point: '방향이 달라도 같다', grid: false, mustMark: true, rotate: 'spin', timer: 0,
    questions: () => shuffle(['PARA', 'PARA', 'TRAP', 'TRAP', 'QUAD']),
    boss: { n: 7, fakeCount: 3, fakes: ['TRAP', 'TRAP', 'QUAD'], reals: ['PARA'] },
    intro: '부품이 빙글 돌아가 있어도 평행한 변은 그대로 평행해요!' },
  { no: 4, name: '미래 박물관', icon: '🏛️', point: '특별한 평행사변형', grid: false, mustMark: true, rotate: 'none', timer: 0,
    questions: () => shuffle(['RECT', 'SQUARE', 'RHOMBUS', 'KITE', 'ISO_TRAP']),
    boss: { n: 8, fakeCount: 3, fakes: ['KITE', 'ISO_TRAP', 'TRAP'], reals: ['RECT', 'SQUARE', 'RHOMBUS', 'PARA'] },
    intro: '직사각형, 정사각형, 마름모는 진짜일까요, 가짜일까요? 정의로 판단해요!' },
  { no: 5, name: '우주 정거장', icon: '🚀', point: '눈속임 간파 (도전)', grid: false, mustMark: true, rotate: 'any', timer: 0,
    questions: () => shuffle(['NEAR_PARA', 'NEAR_PARA', pick(['NEAR_PARA', 'PARA']), 'PARA', pick(['RECT', 'RHOMBUS'])]),
    boss: { n: 8, fakeCount: 3, fakes: ['NEAR_PARA'], reals: ['PARA', 'RECT', 'RHOMBUS'] },
    intro: '아주 살짝 비튼 가짜가 숨어 있어요. 📏 늘이기를 활용해요.' },
];

function explain(q) {
  const par = q.pairs.indexOf(true);
  const rotNote = (q.rot && TYPE_INFO[q.type].real) ? ' 돌려 놓아도 평행한 변은 그대로 평행해요.' : '';
  switch (q.type) {
    case 'PARA': return '마주 보는 두 쌍의 변이 모두 평행해요! 그래서 진짜 평행사변형이에요.' + rotNote;
    case 'RECT': return '직사각형도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'SQUARE': return '정사각형도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'RHOMBUS': return '마름모도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'TRAP': return `${PAIR_NAMES[par]}은 평행하지만, 다른 쌍은 늘이면 만나요. 평행한 변이 한 쌍뿐인 사다리꼴이라 가짜예요!`;
    case 'ISO_TRAP': return `양옆 변의 길이가 같아 보여도 평행한 변은 ${PAIR_NAMES[par]} 한 쌍뿐이에요. 등변사다리꼴도 사다리꼴이라 가짜예요!`;
    case 'KITE': return '연꼴은 마주 보는 변을 늘이면 모두 만나요. 평행한 변이 하나도 없어서 가짜예요!';
    case 'QUAD': return '마주 보는 변을 늘이면 모두 만나요. 평행한 변이 하나도 없어서 가짜예요!';
    case 'NEAR_PARA': return par >= 0
      ? `삐뚤이가 꼭짓점을 살짝 옮겼어요! ${PAIR_NAMES[par]}은 평행하지만 다른 쌍은 늘이면 만나요. 가짜예요!`
      : '삐뚤이가 꼭짓점을 살짝 옮겼어요! 평행해 보여도 늘이면 만나요. 평행한 변이 없어서 가짜예요!';
  }
  return '';
}

// 게임 전체 상태
// 단계 기록: done·stars·score = 이번 도전의 진행, best·bestStars = 지금까지의 최고 기록(재도전해도 유지)
const STAGE_SEC = 60;   // 단계마다 문제를 푸는 제한시간(초) — 정답 확인·설명 중에는 멈춘다
const STAR_RULE = [4, 7];   // 60초 동안 한 번에 맞힌 부품 수: 4개↑ ★★, 7개↑ ★★★
const blankStage = () => ({ done: false, stars: 0, score: 0, best: 0, bestStars: 0 });
const GS = {
  name: '탐정',
  stages: STAGES.map(blankStage),
  parts: [],          // 모은 진짜 평행사변형 부품 (엔딩 건물 창문)
};
let RUN = null;       // 현재 스테이지 진행 기록

// ---- 기록 저장 (이 기기의 브라우저에 이름별로 저장, 서버 전송 없음) ----
const SAVE_KEY = 'fakeParallelogramGame.v1';
function loadAll() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.profiles) return d; } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
  return { profiles: {}, last: '' };
}
function saveGS() {
  try {
    const all = loadAll();
    all.profiles[GS.name] = { stages: GS.stages, parts: GS.parts.slice(-30), saved: Date.now() };
    all.last = GS.name;
    localStorage.setItem(SAVE_KEY, JSON.stringify(all));
  } catch (e) { /* 저장 실패해도 게임은 계속 */ }
}
function loadProfile(name) {
  const p = loadAll().profiles[name];
  GS.name = name;
  GS.stages = STAGES.map((_, i) => Object.assign(blankStage(), p && p.stages && p.stages[i]));
  GS.parts = (p && p.parts) || [];
  return !!p;
}
// 처음부터 재도전: 이번 도전(층·별·점수)만 지우고 최고 기록은 남긴다
function restartRun() {
  GS.stages.forEach(s => { s.done = false; s.stars = 0; s.score = 0; });
  GS.parts = [];
  saveGS();
}
const sumOf = key => GS.stages.reduce((a, s) => a + (s[key] || 0), 0);

/* =====================================================================
   ② 기하 함수 : isParallel, isParallelogram, 도형 생성·회전
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const P = (x, y) => ({ x, y });
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const mul = (a, k) => P(a.x * k, a.y * k);
const cross = (u, v) => u.x * v.y - u.y * v.x;
const dot = (u, v) => u.x * v.x + u.y * v.y;
const len = u => Math.hypot(u.x, u.y);
const unitV = u => { const l = len(u) || 1; return P(u.x / l, u.y / l); };
function rotP(p, ang, o = P(0, 0)) { const c = Math.cos(ang), s = Math.sin(ang), d = sub(p, o); return P(o.x + d.x * c - d.y * s, o.y + d.x * s + d.y * c); }

// p, q: 변의 시작/끝 점 {x, y} — 두 방향 벡터의 외적이 0이면 평행
function isParallel(p1, p2, q1, q2, eps = 1e-6) {
  const u = sub(p2, p1), v = sub(q2, q1);
  return Math.abs(cross(u, v)) < eps * Math.max(1, len(u) * len(v));
}
function isParallelogram(A, B, C, D) { return isParallel(A, B, D, C) && isParallel(A, D, B, C); }
function countParallelPairs(A, B, C, D) { return (isParallel(A, B, D, C) ? 1 : 0) + (isParallel(A, D, B, C) ? 1 : 0); }
function pairFlags(vs) { return [isParallel(vs[0], vs[1], vs[3], vs[2]), isParallel(vs[0], vs[3], vs[1], vs[2])]; }

function signedArea(vs) { let s = 0; for (let i = 0; i < 4; i++) { const a = vs[i], b = vs[(i + 1) % 4]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function isConvex(vs) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = vs[i], b = vs[(i + 1) % 4], c = vs[(i + 2) % 4];
    const z = cross(sub(b, a), sub(c, b));
    if (Math.abs(z) < 1e-9) return false;
    const s = Math.sign(z);
    if (!sign) sign = s; else if (s !== sign) return false;
  }
  return true;
}
function angleAt(vs, i) {
  const p = vs[i], u = sub(vs[(i + 3) % 4], p), v = sub(vs[(i + 1) % 4], p);
  return Math.acos(Math.max(-1, Math.min(1, dot(u, v) / (len(u) * len(v))))) * 180 / Math.PI;
}
function lineAngleDiff(p1, p2, q1, q2) {
  const a = Math.atan2(p2.y - p1.y, p2.x - p1.x), b = Math.atan2(q2.y - q1.y, q2.x - q1.x);
  let d = Math.abs(a - b) * 180 / Math.PI % 180; if (d > 90) d = 180 - d; return d;
}
function pairAngleDiff(vs, p) { return p === 0 ? lineAngleDiff(vs[0], vs[1], vs[3], vs[2]) : lineAngleDiff(vs[0], vs[3], vs[1], vs[2]); }
function lineIntersect(a, b, c, d) {
  const r = sub(b, a), s = sub(d, c), den = cross(r, s);
  if (Math.abs(den) < 1e-9) return null;
  const t = cross(sub(c, a), s) / den;
  return add(a, mul(r, t));
}
function distSeg(p, a, b) {
  const ab = sub(b, a), t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / (dot(ab, ab) || 1)));
  return len(sub(p, add(a, mul(ab, t))));
}
// 화면에서 시계 방향, 가장 위(왼쪽) 꼭짓점이 ㄱ이 되도록 정리
function normalize(vs) {
  vs = vs.map(p => P(p.x, p.y));
  if (signedArea(vs) < 0) vs = [vs[0], vs[3], vs[2], vs[1]];
  let k = 0;
  for (let i = 1; i < 4; i++) if (vs[i].y < vs[k].y - 1e-9 || (Math.abs(vs[i].y - vs[k].y) < 1e-9 && vs[i].x < vs[k].x)) k = i;
  vs = [0, 1, 2, 3].map(i => vs[(i + k) % 4]);
  const mx = Math.min(...vs.map(p => p.x)), my = Math.min(...vs.map(p => p.y));
  return vs.map(p => P(p.x - mx, p.y - my));
}
const transpose = vs => vs.map(p => P(p.y, p.x));
const flipY = vs => vs.map(p => P(p.x, -p.y));
const sig = vs => vs.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join('|');

// 유형별 템플릿 (모눈 정수 좌표)
const RAW = {
  PARA(o) {
    const b = o.big ? 2 : 0;
    if (Math.random() < 0.6) {
      const a = ri(3, 6) + b, h = ri(2, 4) + (o.big ? 1 : 0), s = ri(1, 3) * pick([-1, 1]);
      const vs = [P(0, 0), P(a, 0), P(a + s, h), P(s, h)];
      return Math.random() < 0.25 ? transpose(vs) : vs;
    }
    const u = P(ri(3, 5) + b, ri(-2, 2)), v = P(ri(-3, 3), ri(2, 4) + (o.big ? 1 : 0));
    return [P(0, 0), u, add(u, v), v];
  },
  RECT() {
    if (Math.random() < 0.6) { let a = ri(3, 7), b = ri(2, 5); if (a === b) a++; return [P(0, 0), P(a, 0), P(a, b), P(0, b)]; }
    const [p, q] = pick([[2, 1], [1, 2], [3, 1], [1, 3]]), [m1, m2] = pick([[2, 1], [1, 2]]);
    const u = mul(P(p, q), m1), v = mul(P(-q, p), m2);
    return [P(0, 0), u, add(u, v), v];
  },
  SQUARE() {
    if (Math.random() < 0.5) { const a = ri(3, 5); return [P(0, 0), P(a, 0), P(a, a), P(0, a)]; }
    const [p, q] = pick([[3, 1], [1, 3], [2, 2], [3, 2], [2, 3]]);
    const u = P(p, q), v = P(-q, p);
    return [P(0, 0), u, add(u, v), v];
  },
  RHOMBUS() {
    if (Math.random() < 0.5) { const a = ri(2, 4); let b = ri(2, 4); if (a === b) b = a + 1; return [P(0, -b), P(a, 0), P(0, b), P(-a, 0)]; }
    const [u, v] = pick([[P(5, 0), P(3, 4)], [P(5, 0), P(-3, 4)], [P(4, 3), P(0, 5)], [P(3, 4), P(0, 5)], [P(4, -3), P(4, 3)]]);
    return [P(0, 0), u, add(u, v), v];
  },
  TRAP() {
    const t = ri(2, 6); let b = ri(3, 8); if (t === b) b += 2;
    const h = ri(2, 4), off = ri(-1, b - t + 1);
    let vs = [P(off, 0), P(off + t, 0), P(b, h), P(0, h)];
    if (Math.random() < 0.3) vs = flipY(vs);
    if (Math.random() < 0.3) vs = transpose(vs);
    return vs;
  },
  ISO_TRAP() {
    const b = ri(5, 8), s = ri(1, Math.floor((b - 2) / 2)), h = ri(2, 4);
    let vs = [P(s, 0), P(b - s, 0), P(b, h), P(0, h)];
    if (Math.random() < 0.5) vs = flipY(vs);
    if (Math.random() < 0.3) vs = transpose(vs);
    return vs;
  },
  KITE() {
    const w = ri(2, 3), t = ri(1, 3); let bb = ri(3, 5); if (bb === t) bb++;
    let vs = [P(0, 0), P(w, t), P(0, t + bb), P(-w, t)];
    if (Math.random() < 0.5) vs = flipY(vs);
    if (Math.random() < 0.5) vs = transpose(vs);
    return vs;
  },
  QUAD() { return [P(ri(-4, -1), ri(-4, -1)), P(ri(1, 4), ri(-4, -1)), P(ri(1, 4), ri(1, 4)), P(ri(-4, -1), ri(1, 4))]; },
  NEAR_PARA(o) {
    const vs = RAW.PARA({ big: o.big });
    const k = ri(0, 3);
    if (o.subtle) {
      if (Math.random() < 0.6) {          // 꼭짓점을 이웃 꼭짓점 기준으로 2~3° 돌리기 → 평행 0쌍
        const deg = (2 + Math.random()) * pick([-1, 1]);
        vs[k] = rotP(vs[k], deg * Math.PI / 180, vs[(k + 3) % 4]);
      } else {                            // 변을 살짝 늘이기 → 평행 1쌍
        const d = sub(vs[k], vs[(k + 3) % 4]);
        vs[k] = add(vs[k], mul(d, 0.08 + Math.random() * 0.05));
      }
      return vs;
    }
    vs[k] = add(vs[k], pick([P(1, 0), P(-1, 0), P(0, 1), P(0, -1)]));   // 모눈 1칸 이동
    return vs;
  },
};

function genShape(type, o = {}) {
  for (let tries = 0; tries < 400; tries++) {
    const vs = normalize(RAW[type](o));
    if (!isConvex(vs)) continue;
    if (Math.min(...[0, 1, 2, 3].map(i => angleAt(vs, i))) < 26) continue;
    const f = pairFlags(vs), n = f.filter(Boolean).length, want = TYPE_INFO[type].pairs;
    if (want >= 0 ? n !== want : n >= 2) continue;
    if (type === 'PARA') {
      if (Math.abs(angleAt(vs, 0) - 90) < 1e-6) continue;                          // 직사각형 제외
      if (Math.abs(len(sub(vs[1], vs[0])) - len(sub(vs[3], vs[0]))) < 1e-6) continue; // 마름모 제외
    }
    // 평행하지 않은 쌍은 눈으로도 구분될 만큼 (NEAR_PARA는 일부러 미세하게)
    if (type !== 'NEAR_PARA') {
      const minDiff = type === 'QUAD' && o.obvious ? 15 : 7;
      if ([0, 1].some(p => !f[p] && pairAngleDiff(vs, p) < minDiff)) continue;
    }
    const w = Math.max(...vs.map(p => p.x)), h = Math.max(...vs.map(p => p.y));
    if (w > (o.maxW || 12) || h > (o.maxH || 9)) continue;
    if (o.avoid && o.avoid.has(sig(vs))) continue;
    return vs;
  }
  // 크기·중복 조건이 너무 빡빡하면 조건을 풀어서 다시 만든다 (게임이 멈추지 않도록)

function rotFor(mode) {
  if (mode === 'none') return 0;
  if (mode === 'spin' && Math.random() < 0.35) return pick([90, 180, 270]) * Math.PI / 180;
  let d; do { d = ri(15, 345); } while (d % 90 < 12 || d % 90 > 78);
  return d * Math.PI / 180;
}
let QID = 0;
function makeQuestion(type, cfg, o = {}) {

  // 정답은 수동 입력하지 않고 로직으로 자동 판정
  const answer = isParallelogram(vs[0], vs[1], vs[2], vs[3]) ? 'real' : 'fake';
  console.assert((answer === 'real') === TYPE_INFO[type].real, '정답 검증 실패', type, vs);
  return { id: ++QID, type, verts: vs, pairs, count, answer, rot: o.rot !== undefined ? o.rot : rotFor(cfg.rotate) };
}
function buildStageQuestions(i) {

  return cfg.questions().map(t => {
    const o = { obvious: cfg.obvious, subtle: i === 4, big: i === 4, maxW: i < 2 ? 9 : 12, maxH: i < 2 ? 6 : 9, avoid: seen };
    const q = makeQuestion(t, cfg, o);
    seen.add(sig(q.verts));

}

(function selfCheck() {

})();

function drawBg(scene) {
  const W = scene.scale.width, H = scene.scale.height, g = scene.add.graphics().setDepth(-10);

    const w = 60 + ((x * 7) % 50), h = 70 + ((x * 13) % 140);
    g.fillStyle(0x8fb8de, 0.16).fillRect(x, H - h, w, h);

function burst(scene, x, y, colors = [C.red, C.blue, C.yellow, C.green, 0xb48cff], n = 22) {
  for (let i = 0; i < n; i++) {
    const g = scene.add.graphics().setDepth(70);
    para(g, -7, -5, 12, 10, 3, pick(colors), false);
    g.setPosition(x, y).setAngle(ri(0, 360));
    const a = Math.random() * Math.PI * 2, d = ri(70, 190);
    scene.tweens.add({ targets: g, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d + 30, angle: g.angle + ri(-360, 360), alpha: 0,
      scale: { from: 1.5, to: 0.4 }, duration: ri(600, 1000), ease: 'Cubic.easeOut', onComplete: () => g.destroy() });
  }
}
function banner(scene, text, color = '#e8453c', size = 64) {
  const t = txt(scene, scene.scale.width / 2, scene.scale.height * 0.38, text, size, color, { stroke: '#ffffff', strokeThickness: 12 })
    .setOrigin(0.5).setDepth(90).setScale(0).setAngle(-6);
  scene.tweens.add({ targets: t, scale: 1, angle: 0, duration: 320, ease: 'Back.easeOut',
    onComplete: () => scene.tweens.add({ targets: t, alpha: 0, y: t.y - 50, delay: 600, duration: 400, onComplete: () => t.destroy() }) });
}
function shootBeam(scene, from, to, color = C.red) {
  return new Promise(res => {
    sfx.whoosh();
    const c = scene.add.container(from.x, from.y).setDepth(85), g = scene.add.graphics();
    g.fillStyle(color).fillRect(-20, -7, 32, 14); g.fillStyle(0xffd0c8).fillTriangle(12, -7, 12, 7, 26, 0);
    g.lineStyle(2, C.ink).strokeRect(-20, -7, 32, 14);
    c.add(g).setRotation(Math.atan2(to.y - from.y, to.x - from.x));
    const trail = scene.time.addEvent({ delay: 25, loop: true, callback: () => {
      const d = scene.add.circle(c.x, c.y, ri(4, 9), pick([color, C.yellow, 0xffffff]), 0.9).setDepth(84);
      scene.tweens.add({ targets: d, alpha: 0, scale: 0.2, duration: 380, onComplete: () => d.destroy() });
    } });
    scene.tweens.add({ targets: c, x: to.x, y: to.y, duration: 380, ease: 'Quad.easeIn', onComplete: () => {
      trail.remove(); c.destroy(); burst(scene, to.x, to.y, [C.yellow, 0xffffff, color], 12); res();
    } });
  });
}
function stampAt(scene, x, y, text, color, r) {
  const c = scene.add.container(x, y).setDepth(60), g = scene.add.graphics();
  g.lineStyle(7, color, 0.95).strokeCircle(0, 0, r);
  g.lineStyle(3, color, 0.95).strokeCircle(0, 0, r - 10);
  c.add([g, txt(scene, 0, 0, text, Math.round(r * 0.6), Phaser.Display.Color.IntegerToColor(color).rgba, { stroke: '#ffffff', strokeThickness: 6 }).setOrigin(0.5)]);
  c.setAngle(-14).setScale(2.4).setAlpha(0);
  scene.tweens.add({ targets: c, scale: 1, alpha: 0.92, duration: 240, ease: 'Back.easeOut', onComplete: () => scene.cameras.main.shake(120, 0.003) });
  return c;
}

class VillainHud {
  // cfg: {x, y, s, barX, barY, barW, bubbleX, bubbleY}
  constructor(scene, cfg, maxHp) {
    this.scene = scene; this.cfg = cfg; this.maxHp = maxHp; this.hp = maxHp; this.shown = maxHp;
    this.v = makePpittul(scene, cfg.x, cfg.y, cfg.s).setDepth(30);
    txt(scene, cfg.barX, cfg.barY - 4, '😈 삐뚤이 HP', 18, '#7a3fd1').setOrigin(0, 1).setDepth(30);
    this.bar = scene.add.graphics().setDepth(30);
    this.bubble = scene.add.container(cfg.bubbleX, cfg.bubbleY).setDepth(75).setVisible(false);
    this.bubbleG = scene.add.graphics();
    this.bubbleT = txt(scene, 0, 0, '', 20, '#4a2a8a', { align: 'center', wordWrap: { width: 220, useAdvancedWrap: true } }).setOrigin(0.5);
    this.bubble.add([this.bubbleG, this.bubbleT]);
    this.drawBar();
  }
  pos() { return P(this.cfg.x, this.cfg.y); }
  drawBar() {
    const c = this.cfg, g = this.bar, f = Math.max(0, this.shown / this.maxHp);
    g.clear();
    g.fillStyle(0x1b2340, 0.15).fillRoundedRect(c.barX, c.barY, c.barW, 16, 8);
    if (f > 0.01) g.fillStyle(f > 0.5 ? 0xb48cff : (f > 0.25 ? C.orange : C.red)).fillRoundedRect(c.barX, c.barY, Math.max(16, c.barW * f), 16, 8);
    g.lineStyle(2, C.ink, 0.6).strokeRoundedRect(c.barX, c.barY, c.barW, 16, 8);
  }
  talk(s, dur = 2000) {
    const sc = this.scene, c = this.cfg;
    this.bubbleT.setText(s);
    const w = this.bubbleT.width + 30, h = this.bubbleT.height + 20, g = this.bubbleG;
    const d = unitV(sub(P(c.x, c.y), P(c.bubbleX, c.bubbleY))), B = P(d.x * (w / 2 - 12), d.y * (h / 2 - 6)), T = add(B, mul(d, 26)), p = mul(P(-d.y, d.x), 9);
    g.clear();
    g.fillStyle(0xffffff, 0.97).fillTriangle(B.x + p.x, B.y + p.y, B.x - p.x, B.y - p.y, T.x, T.y);
    g.lineStyle(3, 0xb48cff).strokeTriangle(B.x + p.x, B.y + p.y, B.x - p.x, B.y - p.y, T.x, T.y);
    g.fillStyle(0xffffff, 0.97).fillRoundedRect(-w / 2, -h / 2, w, h, 14);
    g.lineStyle(3, 0xb48cff).strokeRoundedRect(-w / 2, -h / 2, w, h, 14);
    this.bubble.setVisible(true).setScale(0.5);
    sc.tweens.add({ targets: this.bubble, scale: 1, duration: 200, ease: 'Back.easeOut' });
    if (this.hideEv) this.hideEv.remove();
    this.hideEv = sc.time.delayedCall(dur, () => this.bubble.setVisible(false));
  }
  hit(n, line) {
    const sc = this.scene, c = this.cfg;
    this.hp = Math.max(0, this.hp - n);
    sfx.hit();
    sc.tweens.addCounter({ from: this.shown, to: this.hp, duration: 450, onUpdate: t => { this.shown = t.getValue(); this.drawBar(); } });
    sc.tweens.add({ targets: this.v, x: c.x + 10, duration: 45, yoyo: true, repeat: 4, onComplete: () => { this.v.x = c.x; } });
    sc.tweens.add({ targets: this.v, scaleX: 1.3, scaleY: 0.7, duration: 90, yoyo: true });
    floatText(sc, c.x, c.y - 40 * c.s, `-${n}`, '#d63b2f');
    this.talk(line || pick(HIT_FAKE));
  }
  laugh(line) {
    const sc = this.scene, y0 = this.cfg.y;
    sfx.laugh();
    sc.tweens.add({ targets: this.v, y: y0 - 16, duration: 110, yoyo: true, repeat: 2, onComplete: () => { this.v.y = y0; } });
    this.talk(line || pick(LAUGH));
  }
  ko() {
    const sc = this.scene;
    this.talk('으아아~ 기억해 두겠다!', 2600);
    sc.tweens.killTweensOf(this.v);
    sc.tweens.add({ targets: this.v, x: sc.scale.width + 160, y: this.v.y - 90, angle: 900, duration: 1300, delay: 500, ease: 'Cubic.easeIn' });
  }
}

// 진짜 부품은 '오늘 짓는 층'에 끼우고, 가짜는 쓰레기통으로
class PartsTray {
  constructor(scene, portrait) {
    this.scene = scene; this.pt = portrait; this.slots = []; this.filled = 0; this.trash = 0;
    const g = scene.add.graphics().setDepth(4);
    if (!portrait) {
      const x = 778, y = 300, w = 144, h = 184;
      txt(scene, x + w / 2, y - 22, '🏗️ 오늘 짓는 층', 19).setOrigin(0.5, 1);
      g.fillStyle(0x5b6787).fillTriangle(x - 8, y - 2, x + w + 8, y - 2, x + w / 2, y - 18);
      g.fillStyle(0xfff6e0).fillRect(x, y, w, h); g.lineStyle(3, C.ink).strokeRect(x, y, w, h);
      for (let r = 2; r >= 0; r--) for (let c = 0; c < 2; c++) this.slots.push({ x: x + 39 + c * 66, y: y + 33 + r * 59, s: 46 });
      this.trashT = txt(scene, x + w / 2, y + h + 8, '🗑️ 압수한 가짜 ×0', 19, '#c0392b').setOrigin(0.5, 0);
    } else {
      txt(scene, 430, 102, '🏗️ 오늘 짓는 층', 18);
      for (let i = 0; i < 5; i++) this.slots.push({ x: 452 + i * 50, y: 160, s: 42 });
      this.trashT = txt(scene, 692, 102, '🗑️ ×0', 18, '#c0392b').setOrigin(1, 0);
    }
    this.slots.forEach(s => {
      g.fillStyle(0xffffff, 0.85).fillRoundedRect(s.x - s.s / 2 - 3, s.y - s.s / 2 - 3, s.s + 6, s.s + 6, 8);
      g.lineStyle(2, C.ink, 0.25).strokeRoundedRect(s.x - s.s / 2 - 3, s.y - s.s / 2 - 3, s.s + 6, s.s + 6, 8);
    });
  }
  addReal(view) {
    const sc = this.scene;
    this.minis = this.minis || [];
    // 칸이 다 차면 한 층 완성 → 보너스를 주고 칸을 비운다
    if (this.minis.length >= this.slots.length) {
      this.minis.forEach(m => sc.tweens.add({ targets: m, alpha: 0, y: m.y - 30, duration: 300, onComplete: () => m.destroy() }));
      this.minis = [];
      if (RUN) { RUN.score += 50; if (sc.updateHud) sc.updateHud(); }
      floatText(sc, this.slots[0].x, this.slots[0].y - 40, '🏗️ 한 층 완성! +50', '#1f8f57');
    }
    const s = this.slots[this.minis.length];
    this.filled++;
    view.labelsOn = false; view.showGrid = false; view.ext = {}; view.answerMode = false; sfx.whoosh();
    const Rl = Math.max(...view.q.verts.map(p => len(sub(p, view.c)))) || 1;
    return new Promise(res => sc.tweens.add({ targets: view, cx: s.x, cy: s.y, unit: s.s / 2 / Rl, duration: 520, ease: 'Cubic.easeIn',
      onUpdate: () => view.draw(),
      onComplete: () => {
        view.destroy();
        const g = sc.add.graphics().setDepth(6);
        drawMiniShape(g, view.q.verts, 0, 0, s.s, 0xc9f0ff, view.rot, 2);
        this.minis.push(g);
        g.setPosition(s.x, s.y).setScale(1.5);
        sc.tweens.add({ targets: g, scale: 1, duration: 220, ease: 'Back.easeOut' });
        burst(sc, s.x, s.y, [C.yellow, C.green, 0xffffff], 8);
        sfx.mark(); res();
      } }));
  }
  addFake(view) {
    const sc = this.scene;
    view.labelsOn = false; view.showGrid = false; view.ext = {}; sfx.whoosh();
    return new Promise(res => sc.tweens.add({ targets: view, cy: view.cy + 520, rot: view.rot + 1.4, unit: view.unit * 0.5, duration: 560, ease: 'Back.easeIn',
      onUpdate: () => view.draw(),
      onComplete: () => {
        view.destroy(); this.trash++;
        this.trashT.setText(this.pt ? `🗑️ ×${this.trash}` : `🗑️ 압수한 가짜 ×${this.trash}`);
        sc.tweens.add({ targets: this.trashT, scale: { from: 1.5, to: 1 }, duration: 260, ease: 'Back.easeOut' });
        res();
      } }));
  }
}

function topBar(scene, title, h) {
  const W = scene.scale.width, g = scene.add.graphics().setDepth(10);
  g.fillStyle(0xffffff, 0.88).fillRect(0, 0, W, h);
  g.lineStyle(3, C.ink, 0.15).lineBetween(0, h, W, h);
  const portrait = scene.scale.height > W, fs = portrait ? 24 : 28, cy = h / 2;
  txt(scene, 16, cy, title, fs).setOrigin(0, 0.5).setDepth(11);
  const prog = txt(scene, portrait ? W * 0.53 : W * 0.5, cy, '', fs).setOrigin(0.5).setDepth(11);
  const score = txt(scene, portrait ? W * 0.74 : W * 0.68, cy, '', fs, '#b8860b').setOrigin(0.5).setDepth(11);
  makeMuteBtn(scene, W - 106, cy).setDepth(11);
  new Btn(scene, W - 40, cy, 56, 50, '⏸', { fontSize: 26, onClick: () => openPause(scene) }).setDepth(11);
  return { prog, score };
}

  }
}

      g.fillStyle(0xffe0dc).fillPoints(wob.map(p => add(p, P(cx, cy))), true); g.lineStyle(4, C.ink).strokePoints(wob.map(p => add(p, P(cx, cy))), true);
    });
    ['?', '?', '!'].forEach((s, i) => {
      const t = txt(this, W * (0.3 + i * 0.2), h * 0.15, s, 54, '#e8453c').setOrigin(0.5); c.add(t);

  }
  cutHero(c, W, h) {
    c.add(makePara(this, W / 2, h * 0.55, 2.2));
    const g = this.add.graphics(); c.add(g);
    g.lineStyle(10, C.red).lineBetween(W * 0.15, h * 0.3, W * 0.32, h * 0.3).lineBetween(W * 0.12, h * 0.42, W * 0.29, h * 0.42);
    g.lineStyle(10, C.blue).lineBetween(W * 0.7, h * 0.25, W * 0.76, h * 0.45).lineBetween(W * 0.82, h * 0.25, W * 0.88, h * 0.45);
    drawChevrons(g, P(W * 0.15, h * 0.3), P(W * 0.32, h * 0.3), 1, C.redD, 8);
    drawChevrons(g, P(W * 0.12, h * 0.42), P(W * 0.29, h * 0.42), 1, C.redD, 8);
    drawChevrons(g, P(W * 0.7, h * 0.25), P(W * 0.76, h * 0.45), 2, C.blueD, 8);
    drawChevrons(g, P(W * 0.82, h * 0.25), P(W * 0.88, h * 0.45), 2, C.blueD, 8);
    const t = txt(this, W / 2, h * 0.12, '건축 탐정단 출동!', 44, C.inkS, { stroke: '#fff', strokeThickness: 10 }).setOrigin(0.5); c.add(t);

function playLayout(W, H) {
  if (W > H) return {
    top: 70, play: { x: 20, y: 84, w: 920, h: 470 }, tools: { x: 956, y: 84, w: 304, h: 470, cols: 1 },
    bottom: { x: 20, y: 566, w: 1240, h: 144 }, portrait: false,
  };
  return {
    top: 76, play: { x: 16, y: 90, w: 688, h: 650 }, tools: { x: 16, y: 752, w: 688, h: 150, cols: 4 },
    bottom: { x: 16, y: 914, w: 688, h: 350 }, portrait: true,
  };
}

// 하단: 패럴 말풍선 + 판정 버튼 (PlayScene·BossScene 공용)
function buildBottom(scene, L, withJudge) {
  const r = L.bottom, g = scene.add.graphics();
  g.fillStyle(0xffffff, 0.85).fillRoundedRect(r.x, r.y, r.w, r.h, 22);
  g.lineStyle(3, C.ink, 0.2).strokeRoundedRect(r.x, r.y, r.w, r.h, 22);
  let msgBox, jb;
  const paraPos = L.portrait ? P(r.x + 74, r.y + 100) : P(r.x + 70, r.y + r.h / 2 - 4);
  if (!L.portrait) {
    makePara(scene, r.x + 70, r.y + r.h / 2 - 4, 0.72);
    msgBox = { x: r.x + 140, y: r.y + 12, w: withJudge ? 640 : r.w - 160, h: r.h - 24 };
    jb = { y: r.y + r.h / 2, x1: r.x + r.w - 350, x2: r.x + r.w - 118, w: 220, h: 108 };
  } else {
    makePara(scene, r.x + 74, r.y + 100, 0.8);
    msgBox = { x: r.x + 150, y: r.y + 14, w: r.w - 164, h: withJudge ? 196 : r.h - 28 };
    jb = { y: r.y + r.h - 70, x1: r.x + r.w * 0.25 + 4, x2: r.x + r.w * 0.75 - 4, w: 320, h: 108 };
  }
  // 말풍선: 정답이면 초록, 오답이면 빨강으로 바뀐다
  const boxG = scene.add.graphics();
  const ty = L.portrait ? msgBox.y + 30 : msgBox.y + msgBox.h / 2;
  const drawBox = mood => {
    const fill = mood === 'good' ? 0xdff8e8 : mood === 'bad' ? 0xffe1dd : 0xf3f8ff;
    const line = mood === 'good' ? C.green : mood === 'bad' ? C.red : C.ink;
    boxG.clear();
    boxG.fillStyle(fill, 1).fillRoundedRect(msgBox.x, msgBox.y, msgBox.w, msgBox.h, 16);
    boxG.lineStyle(mood ? 4 : 2, line, mood ? 0.9 : 0.25).strokeRoundedRect(msgBox.x, msgBox.y, msgBox.w, msgBox.h, 16);
    boxG.fillStyle(fill, 1).fillTriangle(msgBox.x + 2, ty - 12, msgBox.x + 2, ty + 12, msgBox.x - 14, ty);
  };
  drawBox(null);
  const msg = txt(scene, msgBox.x + 18, msgBox.y + msgBox.h / 2, '', 22, C.inkS, { wordWrap: { width: msgBox.w - 34, useAdvancedWrap: true }, lineSpacing: 5 }).setOrigin(0, 0.5);
  const say = (s, mood = null) => {
    drawBox(mood);
    msg.setText(s).setColor(mood === 'good' ? '#17673f' : mood === 'bad' ? '#a3231c' : C.inkS);
    scene.tweens.killTweensOf(msg);
    scene.tweens.add({ targets: msg, x: { from: msgBox.x + 26, to: msgBox.x + 18 }, duration: 160 });
  };
  return { say, jb, msgBox, paraPos };
}

    this.fakeBtn = new Btn(this, jb.x2, jb.y, jb.w, jb.h, '❌ 가짜\n평행사변형', { fontSize: 27, fill: 0xffe0dc, stroke: 0xc0392b,
      onClick: () => this.judge('fake'), onDisabled: () => this.needMark() });

  tutorialQuestion() {

  buildPlayArea() {

    if (this.L.portrait) {
      this.shapeRect = { x: r.x + 14, y: r.y + 172, w: r.w - 28, h: r.h - 186 - tPad };
      g.lineStyle(3, C.ink, 0.12).lineBetween(r.x + 16, r.y + 132, r.x + r.w - 16, r.y + 132);
    } else {
      this.shapeRect = { x: r.x + 14, y: r.y + 40, w: 716, h: r.h - 50 - tPad };
      g.lineStyle(3, C.ink, 0.12).lineBetween(r.x + 740, r.y + 14, r.x + 740, r.y + r.h - 14 - tPad);
    }

    this.qTag = txt(this, sr.x + 4, sr.y - 30, '', 21, '#5b6787').setDepth(20);
  }
  buildTools() {
    const r = this.L.tools, pt = this.L.portrait;
    const defs = [
      { key: 'red', label: ['🖍️ 빨강 색연필', '🖍️ 빨강'], fill: 0xffe3e1, act: () => this.setColor('red') },
      { key: 'blue', label: ['🖍️ 파랑 색연필', '🖍️ 파랑'], fill: 0xe0ecff, act: () => this.setColor('blue') },
      { key: 'eraser', label: ['🧽 지우개', '🧽 지우개'], act: () => this.erase() },
      { key: 'grid', label: ['📐 모눈', '📐 모눈'], act: () => this.toggleGrid() },
      { key: 'ext', label: ['📏 늘이기', '📏 늘이기'], act: () => this.toggleExtend() },
      { key: 'hint', label: ['💡 힌트 (별 −1)', '💡 힌트'], act: () => this.useHint() },
    ];
    if (this.cfg.mustMark) defs.push({ key: 'none', label: ['🚫 평행한 변 없음', '🚫 평행 없음'], act: () => this.declareNone() });
    const n = defs.length, gap = 8;
    let cols = r.cols, rows = Math.ceil(n / cols);
    const w = (r.w - (cols - 1) * gap) / cols, h = Math.min(64, (r.h - (rows - 1) * gap) / rows);
    this.tools = {};
    defs.forEach((d, i) => {
      const cx = r.x + (i % cols) * (w + gap) + w / 2, cy = r.y + Math.floor(i / cols) * (h + gap) + h / 2;
      this.tools[d.key] = new Btn(this, cx, cy, w, h, d.label[pt ? 1 : 0], { fontSize: pt ? 22 : 24, fill: d.fill || 0xffffff, onClick: d.act,
        onDisabled: () => { if (this.isTutorial) this.say('훈련에서는 반짝이는 변만 눌러 보세요!'); } });
    });
  }
  updateTools() {
    const t = this.tools, pt = this.L.portrait;
    t.red.setSelected(this.curColor === 'red');
    t.blue.setSelected(this.curColor === 'blue');
    t.grid.setLabel(this.gridOn ? (pt ? '📐 모눈 끄기' : '📐 모눈 끄기') : '📐 모눈 켜기').setSelected(this.gridOn);
    t.ext.setLabel(`📏 늘이기 (${this.extendsLeft})`).setSelected(!!this.extendMode).setEnabled(this.extendsLeft > 0);
    t.hint.setEnabled(!this.hintUsed);
    if (t.none) t.none.setSelected(!!this.declaredNone);
    if (this.isTutorial) Object.values(t).forEach(b => b.setEnabled(false));
  }
  updateHud() {
    if (this.isTutorial) this.progText.setText('연습 1/1');
    this.scoreText.setText(`⭐ ${RUN.score}`);
    this.comboText.setText(RUN.combo >= 2 ? `🔥 ${RUN.combo}연속 정답${RUN.combo >= 3 ? ' ×1.5' : ''}` : '');

    this.setFrame(ok ? 'good' : 'bad');
    const pp = this.paraPos;
    floatText(this, pp.x + 40, pp.y - 70, ok ? '😆' : '😢', '#ffffff');
  }
  setFrame(mood) {
    const r = this.L.play, g = this.frameG; g.clear();
    const col = mood === 'good' ? C.green : mood === 'bad' ? C.red : C.ink;
    g.lineStyle(mood ? 8 : 4, col, mood ? 0.9 : 0.22).strokeRoundedRect(r.x, r.y, r.w, r.h, 22);
  }
  // 60초가 다 되면 풀던 문제는 그대로 두고(감점 없음) 보스 라운드로
  stageTimeUp() {
    if (this.stageOver) return;
    this.stageOver = true; this.timerOn = false; this.locked = true;
    if (this.view) this.view.selected = null;
    this.realBtn.setVisible(false); this.fakeBtn.setVisible(false); this.nextBtn.setVisible(false);
    sfx.win();
    banner(this, '⏱ 시간 끝!', '#1446a8', 76);
    this.say(`⏱ 60초 끝! ${RUN.answered}개의 부품을 검사했고, ${RUN.firstCorrect}개를 한 번에 맞혔어요. 이제 삐뚤이가 숨어 있는 건물 외벽으로 가요!`, 'good');
    this.time.delayedCall(2200, () => this.scene.start('BossScene', { stage: this.stageIdx }));
  }
  // 삐뚤이 HP를 다 깎으면 KO 보너스, 그리고 다시 일어난다 (60초 안에 몇 번 KO 시킬 수 있을까?)
  koVillain() {
    RUN.ko++;
    RUN.score += 200; this.updateHud();
    sfx.win();
    banner(this, `💥 삐뚤이 KO! +200`, '#7a3fd1', 60);
    burst(this, this.hud.cfg.x, this.hud.cfg.y, undefined, 30);
    this.hud.talk('으으… 아직 안 끝났어! 다시 간다!', 2200);
    this.time.delayedCall(900, () => { this.hud.hp = this.hud.maxHp; this.hud.shown = this.hud.maxHp; this.hud.drawBar(); });
  }
  revealAnswer() {
    const v = this.view;
    v.marks = { red: null, blue: null }; v.answerMode = true; v.highlight = null;
    const edges = [0, 1].filter(p => !this.q.pairs[p]).flatMap(p => PAIR_EDGES[p]);
    return edges.length ? v.extend(edges, C.orange, 1000) : new Promise(r => this.time.delayedCall(500, r));
  }
  showNext() {
    this.realBtn.setVisible(false); this.fakeBtn.setVisible(false);
    this.nextBtn.setLabel(this.isTutorial ? '🗺️ 미래 도시로 출동!' : '다음 부품 ▶');
    this.nextBtn.setVisible(true);
    if (this.isTutorial) return;
    RUN.answered++;
    // 맞혔으면 잠깐 뒤 자동으로 다음 부품 (틀렸을 때는 설명을 읽고 직접 누른다)
    const q = this.q;
    if (this.lastCorrect) this.time.delayedCall(1400, () => { if (this.q === q && !this.leaving) this.nextQuestion(); });
  }
  nextQuestion() {
    if (this.isTutorial) { this.scene.start('StageSelectScene'); return; }
    if (this.leaving) return;
    this.leaving = true; this.nextBtn.setVisible(false);
    const q = this.q, v = this.view, st = this.mainStamp;
    if (q.firstTry === false) { RUN.wrongQs++; RUN.wrongList.push(q); }
    this.view = null; this.mainStamp = null;
    if (st) this.tweens.add({ targets: st, y: st.y + 520, alpha: 0, angle: 60, duration: 560, ease: 'Back.easeIn', onComplete: () => st.destroy() });
    (q.answer === 'real' ? this.tray.addReal(v) : this.tray.addFake(v)).then(() => {
      this.leaving = false;
      this.qIndex++;
      // 60초 동안 문제가 끊이지 않도록 다 쓰면 새로 만들어 붙인다
      if (this.qIndex >= this.questions.length) this.questions.push(...buildStageQuestions(this.stageIdx));
      this.showQuestion();
    });
  }
}

class BossScene extends Phaser.Scene {
  constructor() { super('BossScene'); }
  init(d) { this.stageIdx = d.stage || 0; this.cfg = STAGES[this.stageIdx]; }
  create() {
    const W = this.scale.width, H = this.scale.height, pt = H > W, cfg = this.cfg, b = cfg.boss;
    drawBg(this);
    this.paused = false; this.locked = false; this.found = 0; this.mistakes = 0; this.wins = [];
    const tb = topBar(this, `${cfg.icon} ${cfg.no}단계 보스: 외벽 검사`, pt ? 76 : 70);
    tb.prog.setText('문제 6/6'); this.scoreText = tb.score; this.scoreText.setText(`⭐ ${RUN.score}`);
    const L = pt
      ? { facade: { x: 40, y: 200, w: 640, h: 690 }, bottom: { x: 16, y: 914, w: 688, h: 350 }, portrait: true }
      : { facade: { x: 150, y: 128, w: 980, h: 420 }, bottom: { x: 20, y: 566, w: 1240, h: 144 }, portrait: false };
    const F = this.facade = L.facade, g = this.add.graphics();
    // 건물 외벽
    g.fillStyle(0x1b2340, 0.12).fillRect(F.x + 10, F.y + 10, F.w, F.h);
    g.fillStyle([0xffe9c7, 0xd6e6ff, 0xd8fbff, 0xfff6d6, 0xe8e0ff][this.stageIdx]).fillRect(F.x, F.y, F.w, F.h);
    g.lineStyle(5, C.ink).strokeRect(F.x, F.y, F.w, F.h);
    g.fillStyle(0x5b6787).fillRect(F.x - 20, F.y - 24, F.w + 40, 26);
    g.lineStyle(4, C.ink).strokeRect(F.x - 20, F.y - 24, F.w + 40, 26);
    this.hud = new VillainHud(this, pt
      ? { x: F.x + F.w - 70, y: F.y - 66, s: 0.75, barX: F.x + 250, barY: F.y - 64, barW: 220, bubbleX: F.x + F.w - 250, bubbleY: F.y + 70 }
      : { x: 1205, y: 260, s: 0.8, barX: 1142, barY: 350, barW: 126, bubbleX: 1040, bubbleY: 150 }, b.fakeCount);
    this.villain = this.hud.v;
    const sign = txt(this, F.x + 20, F.y - 12, `🔍 창문 ${b.n}개 중 가짜 ${b.fakeCount}개를 모두 찾아 톡! 눌러요`, pt ? 22 : 22, '#ffffff').setOrigin(0, 0.5).setDepth(12);
    if (pt) sign.setFontSize(20);
    // 창문 배치
    const types = [];
    for (let i = 0; i < b.fakeCount; i++) types.push(b.fakes[i % b.fakes.length]);
    while (types.length < b.n) types.push(pick(b.reals));
    const order = shuffle(types);
    const cols = pt ? 2 : (b.n <= 6 ? 3 : 4), rows = Math.ceil(b.n / cols), pad = 18;
    const cw = (F.w - pad * (cols + 1)) / cols, ch = (F.h - pad * (rows + 1)) / rows;
    const seen = new Set();
    for (let s = 0; s < cols * rows; s++) {
      const x = F.x + pad + (s % cols) * (cw + pad), y = F.y + pad + Math.floor(s / cols) * (ch + pad);
      if (s >= b.n) {   // 빈 칸 → 출입문
        const dw = Math.min(cw * 0.5, 110), dh = ch * 0.9;
        g.fillStyle(0x8a5a2b).fillRoundedRect(x + cw / 2 - dw / 2, y + ch - dh, dw, dh, { tl: 14, tr: 14, bl: 0, br: 0 });
        g.lineStyle(4, C.ink).strokeRoundedRect(x + cw / 2 - dw / 2, y + ch - dh, dw, dh, { tl: 14, tr: 14, bl: 0, br: 0 });
        g.fillStyle(C.yellow).fillCircle(x + cw / 2 + dw / 4, y + ch - dh / 2, 6);
        continue;
      }
      g.fillStyle(0x5b6787).fillRoundedRect(x - 5, y - 5, cw + 10, ch + 10, 12);
      g.fillStyle(0xf6fbff).fillRoundedRect(x, y, cw, ch, 10);
      const q = makeQuestion(order[s], cfg, { obvious: true, subtle: false, big: false, maxW: 7, maxH: 5, avoid: seen });
      seen.add(sig(q.verts));
      const inner = { x: x + 8, y: y + 8, w: cw - 16, h: ch - 16 };
      const view = new ShapeView(this, q, inner, { labels: false, lineW: 5, grid: cfg.grid && q.rot === 0, maxUnit: 40, pad: 0.5, circleFit: q.rot !== 0, fill: 0xdff3ff });
      const win = { q, view, done: false, cx: x + cw / 2, cy: y + ch / 2, w: cw, h: ch };
      this.wins.push(win);
      this.add.zone(win.cx, win.cy, cw, ch).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.tapWindow(win));
    }
    const bt = buildBottom(this, L, true);
    this.say = bt.say; this.paraPos = bt.paraPos;
    this.time.delayedCall(900, () => this.hud.talk(pick(BOSS_TAUNT)));
    this.time.addEvent({ delay: 7000, loop: true, callback: () => { if (!this.locked && !this.paused) this.hud.talk(pick(BOSS_TAUNT)); } });
    this.nextBtn = new Btn(this, pt ? W / 2 : W - 254, pt ? L.bottom.y + L.bottom.h - 70 : L.bottom.y + L.bottom.h / 2, pt ? 640 : 440, pt ? 108 : 104, '📊 결과 보기 ▶',
      { fontSize: 30, fill: 0xffe08a, onClick: () => this.scene.start('ResultScene', { stage: this.stageIdx }) }).setDepth(40).setVisible(false);
    this.say(`🏢 보스 라운드! 삐뚤이가 이 건물 외벽에 가짜 창문 ${b.fakeCount}개를 숨겼어요. 가짜 창문을 모두 찾아 눌러 주세요!`);
  }
  update() { this.wins.forEach(w => w.view.draw()); }
  stamp(win, text, color) {
    const r = Math.min(win.w, win.h) * 0.22;
    const c = this.add.container(win.cx + win.w / 2 - r - 4, win.cy - win.h / 2 + r + 4).setDepth(25);
    const g = this.add.graphics();
    g.lineStyle(5, color, 0.95).strokeCircle(0, 0, r);
    g.fillStyle(0xffffff, 0.85).fillCircle(0, 0, r - 3);
    c.add([g, txt(this, 0, 0, text, Math.round(r * 0.55), Phaser.Display.Color.IntegerToColor(color).rgba, { stroke: '#ffffff', strokeThickness: 5 }).setOrigin(0.5)]);
    c.setAngle(-12).setScale(2).setAlpha(0);
    this.tweens.add({ targets: c, scale: 1, alpha: 1, duration: 260, ease: 'Back.easeOut' });
  }
  flashWin(win, ok) {
    const r = this.add.rectangle(win.cx, win.cy, win.w + 10, win.h + 10, ok ? C.green : C.red, 0.45).setDepth(24);
    r.setStrokeStyle(8, ok ? C.green : C.red, 1);
    this.tweens.add({ targets: r, alpha: 0, duration: 800, ease: 'Quad.easeIn', onComplete: () => r.destroy() });
    if (!ok) this.cameras.main.shake(260, 0.008);
  }
  // 막 누르기 방지: 진짜 창문을 누르면 스캐너가 과열되어 잠시 누를 수 없다
  overheat() {
    const sec = 3, F = this.facade;
    this.locked = true;
    const dim = this.add.rectangle(F.x + F.w / 2, F.y + F.h / 2, F.w, F.h, 0x1b2340, 0.35).setDepth(50);
    const t = txt(this, F.x + F.w / 2, F.y + F.h / 2, '', 34, '#ffffff', { align: 'center', stroke: '#d63b2f', strokeThickness: 8 }).setOrigin(0.5).setDepth(51);
    let left = sec;
    const tick = () => t.setText(`🔥 스캐너 과열!\n${left}초 동안 잘 살펴보세요`);
    tick();
    this.time.addEvent({ delay: 1000, repeat: sec - 1, callback: () => {
      left--; tick();
      if (left <= 0) { dim.destroy(); t.destroy(); this.locked = false; }
    } });
  }
  tapWindow(win) {
    if (this.locked || this.paused || win.done) return;
    win.done = true;
    const q = win.q, b = this.cfg.boss;
    if (q.answer === 'fake') {
      this.found++;
      sfx.ding(); RUN.score += 100; this.scoreText.setText(`⭐ ${RUN.score}`); floatText(this, win.cx, win.cy - 30, '+100');
      burst(this, win.cx, win.cy, undefined, 14);
      this.flashWin(win, true);
      win.view.answerMode = true;
      win.view.extend([0, 1].filter(p => !q.pairs[p]).flatMap(p => PAIR_EDGES[p]), C.orange, 700);
      this.stamp(win, '가짜!', C.red);
      const left = b.fakeCount - this.found;
      if (left === 0) this.locked = true;
      shootBeam(this, this.paraPos, this.hud.pos(), C.red).then(() => {
        this.hud.hit(1, left > 0 ? pick(HIT_FAKE) : '으아악!');
        if (left === 0) this.time.delayedCall(400, () => this.finish());
      });
      if (left > 0) this.say(`🎯 찾았다! ${TYPE_INFO[q.type].name} — ${q.count === 0 ? '평행한 변이 하나도 없어요' : '평행한 변이 한 쌍뿐이에요'}. 남은 가짜: ${left}개`, 'good');
    } else {
      sfx.buzz(); this.mistakes++;
      this.flashWin(win, false);
      this.hud.laugh('히히! 그건 진짜 창문이야~');
      this.overheat();
      RUN.wrongByType[q.type] = (RUN.wrongByType[q.type] || 0) + 1;
      RUN.wrongList.push(q);
      win.view.answerMode = true;
      const x0 = win.view.cx;
      this.tweens.add({ targets: win.view, cx: x0 + 8, duration: 50, yoyo: true, repeat: 3, onComplete: () => { win.view.cx = x0; } });
      this.stamp(win, '진짜', C.green);
      this.say(`앗! 이건 진짜예요. ${TYPE_INFO[q.type].name}${q.type === 'PARA' ? '' : '도 평행사변형'} — 마주 보는 두 쌍의 변이 모두 평행해요 (빨강 >, 파랑 >>). 남은 가짜: ${b.fakeCount - this.found}개 (진짜를 누르면 스캐너가 3초 과열돼요!)`, 'bad');
    }
  }
  finish() {
    this.locked = true;
    if (this.mistakes > 0) RUN.wrongQs++;
    this.wins.forEach(w => { if (!w.done && w.q.answer === 'real') w.view.answerMode = true; if (w.q.answer === 'real') GS.parts.push({ verts: w.q.verts, rot: w.q.rot }); });
    sfx.win();
    this.hud.ko();
    banner(this, '🏆 외벽 검사 완료!', '#1f8f57', 60);
    burst(this, this.scale.width / 2, this.scale.height * 0.4, undefined, 40);
    this.say(`🏗️ 외벽 검사 완료! 삐뚤이가 도망갔어요. ${GS.name} 탐정님 덕분에 건물 한 층이 완성됐어요!`, 'good');
    this.nextBtn.setVisible(true);
  }
}

class ResultScene extends Phaser.Scene {

  create() {
    const W = this.scale.width, H = this.scale.height, pt = H > W, cfg = STAGES[this.stageIdx];

      const cols = pt ? 3 : 4, cw = (V.w - 40) / cols, rowH = pt ? 170 : 200;
      list.forEach((q, i) => {
        const cx = V.x + 20 + (i % cols) * cw + cw / 2, cy = V.y + 70 + Math.floor(i / cols) * rowH;
        const box = { x: cx - cw / 2 + 8, y: cy, w: cw - 16, h: rowH - 60 };
        const bg = this.add.graphics();
        bg.fillStyle(0xf3f8ff).fillRoundedRect(box.x, box.y, box.w, box.h, 14);
        bg.lineStyle(2, C.ink, 0.3).strokeRoundedRect(box.x, box.y, box.w, box.h, 14);
        const v = new ShapeView(this, q, { x: box.x + 6, y: box.y + 6, w: box.w - 12, h: box.h - 12 }, { labels: false, lineW: 4, maxUnit: 18, pad: 0.6 });
        v.answerMode = true; this.views.push(v);
        txt(this, cx, box.y + box.h + 8, `${TYPE_INFO[q.type].name}\n(${q.answer === 'real' ? '진짜' : '가짜'})`, 19, q.answer === 'real' ? '#1f8f57' : '#d63b2f', { align: 'center' }).setOrigin(0.5, 0);
        this.add.zone(cx, box.y + box.h / 2, box.w, box.h).setInteractive({ useHandCursor: true }).on('pointerdown', () => { sfx.tap(); this.openReview(q); });
      });
    }
    // 버튼
    const allDone = GS.stages.every(s => s.done);
    const third = (this.stageIdx < 4 && !allDone)
      ? { label: `▶ ${this.stageIdx + 2}단계로`, fill: 0xffe08a, go: () => this.scene.start('PlayScene', { stage: this.stageIdx + 1 }) }
      : { label: '🏁 내 건물 완성 보기', fill: 0xffe08a, go: () => this.scene.start('EndingScene') };
    const defs = [
      { label: '🔁 재도전 (기록 경신)', go: () => this.scene.start('PlayScene', { stage: this.stageIdx }) },
      { label: '🗺️ 도시 지도', go: () => this.scene.start('StageSelectScene') },
      third,
    ];
    if (pt) {
      new Btn(this, W * 0.27, 1100, 300, 84, defs[0].label, { fontSize: 28, onClick: defs[0].go });
      new Btn(this, W * 0.73, 1100, 300, 84, defs[1].label, { fontSize: 28, onClick: defs[1].go });
      new Btn(this, W / 2, 1200, 620, 84, defs[2].label, { fontSize: 30, fill: defs[2].fill, onClick: defs[2].go });
    } else defs.forEach((d, i) => new Btn(this, W / 2 + (i - 1) * 330, 646, 300, 84, d.label, { fontSize: 28, fill: d.fill || 0xffffff, onClick: d.go }));
    if (firstClear || stars === 3) this.time.delayedCall(1100, () => sfx.win());
  }
  update() { this.views.forEach(v => v.draw()); }
  openReview(q) {
    const W = this.scale.width, H = this.scale.height, pt = H > W, objs = [];
    objs.push(this.add.rectangle(W / 2, H / 2, W, H, 0x1b2340, 0.55).setDepth(900).setInteractive());
    const pw = pt ? 660 : 900, ph = pt ? 960 : 620, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    const g = this.add.graphics().setDepth(901);
    g.fillStyle(0xffffff).fillRoundedRect(px, py, pw, ph, 28);
    objs.push(g);
    objs.push(txt(this, W / 2, py + 40, `${TYPE_INFO[q.type].name} → ${q.answer === 'real' ? '진짜 ✅' : '가짜 ❌'} 평행사변형`, 32).setOrigin(0.5).setDepth(902));
    const rect = { x: px + 30, y: py + 80, w: pw - 60, h: ph - (pt ? 330 : 260) };
    const v = new ShapeView(this, q, rect, { depth: 902, maxUnit: 50 });
    v.answerMode = true; this.views.push(v);
    v.extend([0, 1].filter(p => !q.pairs[p]).flatMap(p => PAIR_EDGES[p]), C.orange, 900);
    objs.push(txt(this, W / 2, rect.y + rect.h + 16, explain(q) + `\n평행한 변: ${q.count}쌍 (빨강 >, 파랑 >>)`, 24, C.inkS,
      { align: 'center', wordWrap: { width: pw - 80, useAdvancedWrap: true }, lineSpacing: 6 }).setOrigin(0.5, 0).setDepth(902));
    objs.push(new Btn(this, W / 2, py + ph - 56, 240, 72, '닫기', { fontSize: 28, onClick: () => {
      objs.forEach(o => o.destroy()); this.views = this.views.filter(x => x !== v); v.destroy();
    } }).setDepth(903));
  }
}

class StageSelectScene extends Phaser.Scene {
  constructor() { super('StageSelectScene'); }
  init(d) { this.retry = !!(d && d.retry); }
  create() {
    const W = this.scale.width, H = this.scale.height, pt = H > W;
    drawBg(this);
    txt(this, W / 2, pt ? 70 : 52, '🗺️ 미래 도시 지도', pt ? 44 : 46, C.inkS, { stroke: '#fff', strokeThickness: 8 }).setOrigin(0.5);
    txt(this, W / 2, pt ? 130 : 104, `${GS.name} 탐정님, 검사할 건물을 골라요! (권장 순서: 1 → 5)`, pt ? 24 : 26, '#5b6787').setOrigin(0.5);
    makeMuteBtn(this, W - 44, 40);
    const road = this.add.graphics();
    road.lineStyle(pt ? 70 : 60, 0xffffff, 0.55);
    if (pt) road.lineBetween(W / 2, 170, W / 2, 1010); else road.lineBetween(40, 400, W - 40, 400);
    STAGES.forEach((s, i) => {
      const st = GS.stages[i];
      const card = pt ? { x: 40, y: 170 + i * 168, w: W - 80, h: 150 } : { x: W / 2 + (i - 2) * 244 - 112, y: 150, w: 224, h: 420 };
      const g = this.add.graphics();
      g.fillStyle(0x1b2340, 0.12).fillRoundedRect(card.x + 4, card.y + 6, card.w, card.h, 22);
      g.fillStyle(st.done ? 0xeafff3 : 0xffffff, 0.96).fillRoundedRect(card.x, card.y, card.w, card.h, 22);
      g.lineStyle(4, st.done ? C.green : C.ink, st.done ? 0.9 : 0.35).strokeRoundedRect(card.x, card.y, card.w, card.h, 22);
      const stars = '★'.repeat(st.stars) + '☆'.repeat(3 - st.stars);
      if (pt) {
        drawBuildingIcon(g, i, card.x + 90, card.y + 72, 0.85);
        txt(this, card.x + 190, card.y + 22, `${s.no}단계 ${s.icon} ${s.name}`, 30);
        txt(this, card.x + 190, card.y + 66, s.point, 22, '#5b6787');
        txt(this, card.x + 190, card.y + 102, stars, 30, '#e0a800');
        if (st.best > 0) txt(this, card.x + 330, card.y + 108, `🏆 최고 ${st.best}점`, 21, '#b8860b');
        if (st.done) txt(this, card.x + card.w - 20, card.y + 20, '✔ 완료', 22, '#1f8f57').setOrigin(1, 0);
        if (i === 4) txt(this, card.x + card.w - 20, card.y + card.h - 20, '도전!', 24, '#d63b2f').setOrigin(1, 1);
      } else {
        drawBuildingIcon(g, i, card.x + card.w / 2, card.y + 120, 1.15);
        txt(this, card.x + card.w / 2, card.y + 228, `${s.no}단계`, 24, '#5b6787').setOrigin(0.5);
        txt(this, card.x + card.w / 2, card.y + 264, `${s.icon} ${s.name}`, 28).setOrigin(0.5);
        txt(this, card.x + card.w / 2, card.y + 306, s.point, 20, '#5b6787', { align: 'center', wordWrap: { width: card.w - 20 } }).setOrigin(0.5);
        txt(this, card.x + card.w / 2, card.y + 342, stars, 34, '#e0a800').setOrigin(0.5);
        if (st.best > 0) txt(this, card.x + card.w / 2, card.y + 375, `🏆 최고 ${st.best}점`, 19, '#b8860b').setOrigin(0.5);
        if (st.done) txt(this, card.x + card.w / 2, card.y + 402, '✔ 완료', 22, '#1f8f57').setOrigin(0.5);
        else if (i === 4) txt(this, card.x + card.w / 2, card.y + 402, '🔥 도전!', 22, '#d63b2f').setOrigin(0.5);
        else txt(this, card.x + card.w / 2, card.y + 402, '추천 순서 ' + (i + 1), 20, '#8a93a8').setOrigin(0.5);
      }
      const z = this.add.zone(card.x + card.w / 2, card.y + card.h / 2, card.w, card.h).setInteractive({ useHandCursor: true });
      z.on('pointerover', () => g.setAlpha(0.85)).on('pointerout', () => g.setAlpha(1));
      z.on('pointerdown', () => { sfx.tap(); this.scene.start('PlayScene', { stage: i }); });
    });
    const floors = GS.stages.filter(s => s.done).length;
    const by = pt ? 1120 : 650;
    new Btn(this, pt ? W * 0.27 : W / 2 - 220, by, pt ? 310 : 360, 80, '📖 훈련 다시 하기', { fontSize: 26, onClick: () => this.scene.start('TutorialScene') });
    const eb = new Btn(this, pt ? W * 0.73 : W / 2 + 220, by, pt ? 310 : 360, 80, `🏗️ 내 건물 보기 (${floors}/5층)`, { fontSize: 26, fill: 0xffe08a,
      onClick: () => this.scene.start('EndingScene'), onDisabled: () => sfx.soft() });
    eb.setEnabled(floors > 0);
    txt(this, W / 2, pt ? 1215 : 702, `이번 도전 ${sumOf('score')}점 · ★ ${sumOf('stars')}/15 · 🏆 최고 기록 합계 ${sumOf('best')}점`, 22, '#5b6787').setOrigin(0.5);
    if (this.retry) banner(this, '🔄 재도전! 최고 기록을 넘어 보세요', '#e8453c', 44);
  }
}

class EndingScene extends Phaser.Scene {
  constructor() { super('EndingScene'); }
  create() {
    const W = this.scale.width, H = this.scale.height, pt = H > W;
    drawBg(this);
    const done = GS.stages.map((s, i) => s.done ? i : -1).filter(i => i >= 0);
    const all = done.length === 5;
    txt(this, W / 2, pt ? 70 : 50, all ? '🎉 나만의 미래 건물 완성!' : `🏗️ 나만의 미래 건물 (${done.length}/5층)`, pt ? 40 : 44, C.inkS, { stroke: '#fff', strokeThickness: 8 }).setOrigin(0.5);
    // 건물: 층마다 모은 진짜 평행사변형 부품으로 창문을 만든다
    const bx = pt ? W / 2 : 360, base = pt ? 760 : 670, fw = 360, fh = 82;
    const g = this.add.graphics();
    g.fillStyle(0x7fc89a).fillRect(bx - 260, base, 520, 16);
    const floorCols = [0xffd6a5, 0xa0c4ff, 0x9bf6ff, 0xfdffb6, 0xd0bfff];
    const defaults = [[P(0, 0), P(4, 0), P(5, 3), P(1, 3)], [P(0, 0), P(4, 0), P(4, 3), P(0, 3)], [P(0, 2), P(2, 0), P(4, 2), P(2, 4)]];
    let partIdx = 0;
    done.forEach((si, f) => {
      const fy = base - (f + 1) * fh, fl = this.add.graphics();
      fl.fillStyle(floorCols[si]).fillRect(bx - fw / 2, fy, fw, fh);
      fl.lineStyle(4, C.ink).strokeRect(bx - fw / 2, fy, fw, fh);
      for (let k = 0; k < 4; k++) {
        const part = GS.parts.length ? GS.parts[partIdx++ % GS.parts.length] : { verts: defaults[k % 3], rot: 0 };
        const wx = bx - fw / 2 + 50 + k * 87, wy = fy + fh / 2;
        fl.fillStyle(0xffffff, 0.6).fillRoundedRect(wx - 36, wy - 32, 72, 64, 8);
        drawMiniShape(fl, part.verts, wx, wy, 58, C.glass, part.rot, 3);
      }
      txt(this, bx + fw / 2 + 14, fy + fh / 2, `${STAGES[si].icon} ${STAGES[si].no}층`, 22).setOrigin(0, 0.5);
      fl.setAlpha(0); fl.y = -40;
      this.tweens.add({ targets: fl, alpha: 1, y: 0, duration: 450, delay: 300 + f * 350, ease: 'Bounce.easeOut', onStart: () => sfx.mark() });
    });
    const topY = base - done.length * fh;
    const roof = this.add.graphics();
    roof.fillStyle(0x5b6787).fillTriangle(bx - fw / 2 - 20, topY, bx + fw / 2 + 20, topY, bx, topY - 70);
    roof.lineStyle(4, C.ink).strokeTriangle(bx - fw / 2 - 20, topY, bx + fw / 2 + 20, topY, bx, topY - 70);
    roof.lineStyle(4, C.ink).lineBetween(bx, topY - 70, bx, topY - 110);
    roof.fillStyle(C.red).fillTriangle(bx, topY - 110, bx + 40, topY - 98, bx, topY - 86);
    roof.setAlpha(0); this.tweens.add({ targets: roof, alpha: 1, duration: 400, delay: 300 + done.length * 350 });
    // 배지 + 점수
    const ix = pt ? W / 2 : 900, iy = pt ? 880 : 200;
    const bg = this.add.graphics();
    bg.fillStyle(0xffcc33).fillCircle(ix, iy, 70); bg.lineStyle(6, C.ink).strokeCircle(ix, iy, 70);
    bg.fillStyle(0xffe680).fillCircle(ix, iy, 54);
    para(bg, ix - 34, iy - 22, 50, 44, 18, C.blue, true);
    bg.fillStyle(C.red).fillTriangle(ix - 40, iy + 56, ix - 10, iy + 66, ix - 46, iy + 110).fillTriangle(ix + 40, iy + 56, ix + 10, iy + 66, ix + 46, iy + 110);
    const total = sumOf('score'), stars = sumOf('stars');
    const ty = pt ? 1000 : 340;
    txt(this, ix, ty, `명예 건축 탐정 ${GS.name}`, 34).setOrigin(0.5);
    txt(this, ix, ty + 44, `이번 도전 ${total}점 · ★ ${stars}/15`, 28, '#b8860b').setOrigin(0.5);
    txt(this, ix, ty + 80, `🏆 최고 기록 합계 ${sumOf('best')}점`, 22, '#5b6787').setOrigin(0.5);
    const qBox = txt(this, ix, ty + (pt ? 112 : 118), '💬 내가 설계한 미래 건물의 창문에도\n진짜 평행사변형을 썼나요?\n마주 보는 두 쌍의 변이 평행한지 확인해 봐요!', 24, C.inkS,
      { align: 'center', lineSpacing: 6, backgroundColor: '#ffffffcc', padding: { x: 18, y: 12 } }).setOrigin(0.5, 0);
    if (!pt) makePara(this, 1170, 470, 0.7);
    const by = pt ? 1215 : 650;
    new Btn(this, ix - 160, by, 290, 76, '🗺️ 도시 지도로', { fontSize: 26, onClick: () => this.scene.start('StageSelectScene') });
    new Btn(this, ix + 160, by, 290, 76, '🔄 처음부터 재도전', { fontSize: 24, onClick: () => {
      restartRun();   // 층·별은 처음부터, 최고 기록은 그대로
      this.scene.start('StageSelectScene', { retry: true });
    } });
    if (qBox && all) sfx.win();
    // 색종이
    const cols = [C.red, C.blue, C.yellow, C.green, 0xb48cff];
    for (let i = 0; i < (all ? 70 : 30); i++) {
      const r = this.add.rectangle(ri(0, W), ri(-H, -20), ri(8, 14), ri(12, 20), pick(cols)).setDepth(100).setAngle(ri(0, 360));
      this.tweens.add({ targets: r, y: H + 40, angle: r.angle + ri(180, 720), x: r.x + ri(-80, 80), duration: ri(3000, 6000), delay: ri(0, 3000), repeat: -1 });
    }
  }
}

/* =====================================================================
   ⑤ 게임 실행
   ===================================================================== */
const wantPortrait = () => window.innerHeight > window.innerWidth * 1.05;
let started = false;   // 타이틀을 지나 게임을 시작했는지
// 태블릿을 돌려 가로/세로가 바뀌면 그 방향에 맞는 화면 배치로 다시 만든다 (진행 기록은 유지)
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!window.game || wantPortrait() === (window.game.scale.height > window.game.scale.width)) return;
    const active = window.game.scene.getScenes(true)[0];
    const key = active ? active.scene.key : 'TitleScene';
    window.game.destroy(true);
    startGame(['TitleScene', 'StoryScene', 'TutorialScene', 'EndingScene'].includes(key) ? key : (started ? 'StageSelectScene' : 'TitleScene'));
  }, 400);
});
function startGame(firstKey = 'TitleScene') {
  BootScene.firstKey = firstKey;
  const portrait = wantPortrait();
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#d9f1ff',
    width: portrait ? 720 : 1280,
    height: portrait ? 1280 : 720,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    dom: { createContainer: true },
    scene: [BootScene, TitleScene, StoryScene, TutorialScene, StageSelectScene, PlayScene, BossScene, ResultScene, EndingScene],
  });
}
(function boot() {
  if (typeof Phaser === 'undefined') {
    document.getElementById('loading').textContent = '⚠️ 게임 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    return;
  }
  // 한글 웹폰트는 글자 묶음별로 나뉘어 있으므로, 게임에 쓰인 모든 글자를 미리 불러온다
  const allText = document.getElementById('gamecode').textContent.replace(/[\x00-\x7F]/g, '');
  const ready = (document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('30px "Jua"', allText + '가나다ABC123'), new Promise(r => setTimeout(r, 3000))])
    : Promise.resolve();
  ready.then(() => startGame(), () => startGame());
})();
</script>
