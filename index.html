<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>평행사변형 판별 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
    /* 게임 화면(16:9)과 기기 화면 비율이 달라 생기는 여백도 게임 배경처럼 보이게 */
    background: linear-gradient(160deg, #bfe6ff 0%, #e6e0ff 55%, #c8f5e6 100%); }
  #game { width: 100vw; height: 100vh; height: 100dvh; }   /* dvh: 모바일 주소창을 뺀 실제 보이는 높이 */
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Jua", "Malgun Gothic", sans-serif; font-size: 28px; color: #26324d; }
  #nick { font-family: "Jua", "Malgun Gothic", sans-serif; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="loading">🕵️ 건축 탐정단 준비 중...</div>
<div id="game"></div>
<script id="gamecode">
'use strict';
/* =====================================================================
   ① 설정값 : 색상, 스테이지별 출제 규칙, 피드백 문구
   ===================================================================== */
const FONT = '"Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const C = {
  ink: 0x26324d, inkS: '#26324d', red: 0xE8453C, redD: 0xa3231c, blue: 0x2F7BF6, blueD: 0x1446a8,
  orange: 0xff8c1a, yellow: 0xffd84d, green: 0x2bb673, mint: 0xa8f0d8, glass: 0xe9f7ff,
  gridLine: 0x9cc7e0, gray: 0x7a8499,
};
const LABELS = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ'];
const EDGE_NAMES = ['ㄱㄴ', 'ㄴㄷ', 'ㄷㄹ', 'ㄹㄱ'];
const PAIR_EDGES = [[0, 2], [1, 3]];            // 쌍0: 변ㄱㄴ·변ㄷㄹ, 쌍1: 변ㄴㄷ·변ㄹㄱ
const PAIR_NAMES = ['변 ㄱㄴ과 변 ㄹㄷ', '변 ㄴㄷ과 변 ㄱㄹ'];
const EDGE_DIR = [[0, 1], [1, 2], [3, 2], [0, 3]]; // 평행 기호 화살표 방향을 맞추기 위한 꼭짓점 순서

const TYPE_INFO = {
  PARA:      { name: '평행사변형',        real: true,  pairs: 2 },
  RECT:      { name: '직사각형',          real: true,  pairs: 2 },
  SQUARE:    { name: '정사각형',          real: true,  pairs: 2 },
  RHOMBUS:   { name: '마름모',            real: true,  pairs: 2 },
  TRAP:      { name: '사다리꼴',          real: false, pairs: 1 },
  ISO_TRAP:  { name: '등변사다리꼴',      real: false, pairs: 1 },
  KITE:      { name: '연꼴',              real: false, pairs: 0 },
  QUAD:      { name: '일반 사각형',       real: false, pairs: 0 },
  NEAR_PARA: { name: '‘거의’ 평행사변형', real: false, pairs: -1 },
};

// 3단계: 단계마다 새 규칙 하나씩 (art = 도시 지도 건물 그림 번호)
//  1 창문 공장  : 한 쌍 vs 두 쌍 — 도움(평행 표시)이 20초마다 줄어든다
//  2 미래 박물관: 직사각형·마름모·정사각형도 진짜 — 규칙 반전(진짜를 잡는다), 부품이 빙글빙글 돈다
//  3 우주 정거장: 눈속임 간파 — 떠 있는 진짜가 슬쩍 가짜로 변신한다
const STAGES = [
  { no: 1, name: '창문 공장', icon: '🏠', art: 0, point: '한 쌍 vs 두 쌍', grid: true, rotate: 'none', target: 'fake',
    intro: '평행한 변이 두 쌍이면 진짜, 한 쌍 이하면 가짜! 처음엔 평행 표시가 보이다가 점점 사라져요.' },
  { no: 2, name: '미래 박물관', icon: '🏛️', art: 3, point: '특별한 평행사변형 (규칙 반전!)', grid: false, rotate: 'any', target: 'real',
    intro: '이번엔 반대! 박물관에 전시할 진짜 평행사변형만 잡아요. 부품이 빙글빙글 돌아요.' },
  { no: 3, name: '우주 정거장', icon: '🚀', art: 4, point: '눈속임 간파', grid: true, rotate: 'none', target: 'fake',
    intro: '삐뚤이가 진짜를 몰래 가짜로 바꿔요! 모눈 칸을 세어 보면 살짝 틀어진 게 보여요.' },
];
// 이번 단계에서 잡아야 하는 쪽 이름
const targetWord = cfg => cfg.target === 'real' ? '진짜' : '가짜';

function explain(q) {
  const par = q.pairs.indexOf(true);
  const rotNote = (q.rot && TYPE_INFO[q.type].real) ? ' 돌려 놓아도 평행한 변은 그대로 평행해요.' : '';
  switch (q.type) {
    case 'PARA': return '마주 보는 두 쌍의 변이 모두 평행해요! 그래서 진짜 평행사변형이에요.' + rotNote;
    case 'RECT': return '직사각형도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'SQUARE': return '정사각형도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'RHOMBUS': return '마름모도 마주 보는 두 쌍의 변이 평행하니까 평행사변형이에요! 🎉' + rotNote;
    case 'TRAP': return `${PAIR_NAMES[par]}은 평행하지만, 다른 쌍은 늘이면 만나요. 평행한 변이 한 쌍뿐인 사다리꼴이라 가짜예요!`;
    case 'ISO_TRAP': return `양옆 변의 길이가 같아 보여도 평행한 변은 ${PAIR_NAMES[par]} 한 쌍뿐이에요. 등변사다리꼴도 사다리꼴이라 가짜예요!`;
    case 'KITE': return '연꼴은 마주 보는 변을 늘이면 모두 만나요. 평행한 변이 하나도 없어서 가짜예요!';
    case 'QUAD': return '마주 보는 변을 늘이면 모두 만나요. 평행한 변이 하나도 없어서 가짜예요!';
    case 'NEAR_PARA': return par >= 0
      ? `삐뚤이가 꼭짓점을 살짝 옮겼어요! ${PAIR_NAMES[par]}은 평행하지만 다른 쌍은 늘이면 만나요. 가짜예요!`
      : '삐뚤이가 꼭짓점을 살짝 옮겼어요! 평행해 보여도 늘이면 만나요. 평행한 변이 없어서 가짜예요!';
  }
  return '';
}

// 게임 전체 상태
// 단계 기록: done·stars·score = 이번 도전의 진행, best·bestStars = 지금까지의 최고 기록(재도전해도 유지)
const STAGE_SEC = 60;   // 단계마다 문제를 푸는 제한시간(초) — 정답 확인·설명 중에는 멈춘다
const STAR_RULE = [8, 15];  // 60초 동안 잡은 부품 수: 8개↑ ★★, 15개↑ ★★★ (스캐너 과부하 1번마다 별 −1)
const blankStage = () => ({ done: false, stars: 0, score: 0, best: 0, bestStars: 0 });
const GS = {
  name: '탐정',
  stages: STAGES.map(blankStage),
  parts: [],          // 모은 진짜 평행사변형 부품 (엔딩 건물 창문)
};
let RUN = null;       // 현재 스테이지 진행 기록

// ---- 기록 저장 (이 기기의 브라우저에 이름별로 저장, 서버 전송 없음) ----
const SAVE_KEY = 'fakeParallelogramGame.v2';   // v2: 3단계 구성 (5단계 시절 기록과 섞이지 않게)
function loadAll() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.profiles) return d; } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
  return { profiles: {}, last: '' };
}
function saveGS() {
  try {
    const all = loadAll();
    all.profiles[GS.name] = { stages: GS.stages, parts: GS.parts.slice(-30), saved: Date.now() };
    all.last = GS.name;
    localStorage.setItem(SAVE_KEY, JSON.stringify(all));
  } catch (e) { /* 저장 실패해도 게임은 계속 */ }
}
function loadProfile(name) {
  const p = loadAll().profiles[name];
  GS.name = name;
  GS.stages = STAGES.map((_, i) => Object.assign(blankStage(), p && p.stages && p.stages[i]));
  GS.parts = (p && p.parts) || [];
  return !!p;
}
// 처음부터 재도전: 이번 도전(층·별·점수)만 지우고 최고 기록은 남긴다
function restartRun() {
  GS.stages.forEach(s => { s.done = false; s.stars = 0; s.score = 0; });
  GS.parts = [];
  saveGS();
}
const sumOf = key => GS.stages.reduce((a, s) => a + (s[key] || 0), 0);

/* =====================================================================
   ② 기하 함수 : isParallel, isParallelogram, 도형 생성·회전
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const P = (x, y) => ({ x, y });
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const mul = (a, k) => P(a.x * k, a.y * k);
const cross = (u, v) => u.x * v.y - u.y * v.x;
const dot = (u, v) => u.x * v.x + u.y * v.y;
const len = u => Math.hypot(u.x, u.y);
const unitV = u => { const l = len(u) || 1; return P(u.x / l, u.y / l); };
function rotP(p, ang, o = P(0, 0)) { const c = Math.cos(ang), s = Math.sin(ang), d = sub(p, o); return P(o.x + d.x * c - d.y * s, o.y + d.x * s + d.y * c); }

// p, q: 변의 시작/끝 점 {x, y} — 두 방향 벡터의 외적이 0이면 평행
function isParallel(p1, p2, q1, q2, eps = 1e-6) {
  const u = sub(p2, p1), v = sub(q2, q1);
  return Math.abs(cross(u, v)) < eps * Math.max(1, len(u) * len(v));
}
function isParallelogram(A, B, C, D) { return isParallel(A, B, D, C) && isParallel(A, D, B, C); }
function countParallelPairs(A, B, C, D) { return (isParallel(A, B, D, C) ? 1 : 0) + (isParallel(A, D, B, C) ? 1 : 0); }
function pairFlags(vs) { return [isParallel(vs[0], vs[1], vs[3], vs[2]), isParallel(vs[0], vs[3], vs[1], vs[2])]; }

function signedArea(vs) { let s = 0; for (let i = 0; i < 4; i++) { const a = vs[i], b = vs[(i + 1) % 4]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function isConvex(vs) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = vs[i], b = vs[(i + 1) % 4], c = vs[(i + 2) % 4];
    const z = cross(sub(b, a), sub(c, b));
    if (Math.abs(z) < 1e-9) return false;
    const s = Math.sign(z);
    if (!sign) sign = s; else if (s !== sign) return false;
  }
  return true;
}
function angleAt(vs, i) {
  const p = vs[i], u = sub(vs[(i + 3) % 4], p), v = sub(vs[(i + 1) % 4], p);
  return Math.acos(Math.max(-1, Math.min(1, dot(u, v) / (len(u) * len(v))))) * 180 / Math.PI;
}
function lineAngleDiff(p1, p2, q1, q2) {
  const a = Math.atan2(p2.y - p1.y, p2.x - p1.x), b = Math.atan2(q2.y - q1.y, q2.x - q1.x);
  let d = Math.abs(a - b) * 180 / Math.PI % 180; if (d > 90) d = 180 - d; return d;
}
function pairAngleDiff(vs, p) { return p === 0 ? lineAngleDiff(vs[0], vs[1], vs[3], vs[2]) : lineAngleDiff(vs[0], vs[3], vs[1], vs[2]); }
function lineIntersect(a, b, c, d) {
  const r = sub(b, a), s = sub(d, c), den = cross(r, s);
  if (Math.abs(den) < 1e-9) return null;
  const t = cross(sub(c, a), s) / den;
  return add(a, mul(r, t));
}
function distSeg(p, a, b) {
  const ab = sub(b, a), t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / (dot(ab, ab) || 1)));
  return len(sub(p, add(a, mul(ab, t))));
}
// 화면에서 시계 방향, 가장 위(왼쪽) 꼭짓점이 ㄱ이 되도록 정리
function normalize(vs) {
  vs = vs.map(p => P(p.x, p.y));
  if (signedArea(vs) < 0) vs = [vs[0], vs[3], vs[2], vs[1]];
  let k = 0;
  for (let i = 1; i < 4; i++) if (vs[i].y < vs[k].y - 1e-9 || (Math.abs(vs[i].y - vs[k].y) < 1e-9 && vs[i].x < vs[k].x)) k = i;
  vs = [0, 1, 2, 3].map(i => vs[(i + k) % 4]);
  const mx = Math.min(...vs.map(p => p.x)), my = Math.min(...vs.map(p => p.y));
  return vs.map(p => P(p.x - mx, p.y - my));
}
const transpose = vs => vs.map(p => P(p.y, p.x));
const flipY = vs => vs.map(p => P(p.x, -p.y));
const sig = vs => vs.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join('|');

// 유형별 템플릿 (모눈 정수 좌표)
const RAW = {
  PARA(o) {
    const b = o.big ? 2 : 0;
    if (Math.random() < 0.6) {
      const a = ri(3, 6) + b, h = ri(2, 4) + (o.big ? 1 : 0), s = ri(1, 3) * pick([-1, 1]);
      const vs = [P(0, 0), P(a, 0), P(a + s, h), P(s, h)];
      return Math.random() < 0.25 ? transpose(vs) : vs;
    }
    const u = P(ri(3, 5) + b, ri(-2, 2)), v = P(ri(-3, 3), ri(2, 4) + (o.big ? 1 : 0));
    return [P(0, 0), u, add(u, v), v];
  },
  RECT() {
    if (Math.random() < 0.6) { let a = ri(3, 7), b = ri(2, 5); if (a === b) a++; return [P(0, 0), P(a, 0), P(a, b), P(0, b)]; }
    const [p, q] = pick([[2, 1], [1, 2], [3, 1], [1, 3]]), [m1, m2] = pick([[2, 1], [1, 2]]);
    const u = mul(P(p, q), m1), v = mul(P(-q, p), m2);
    return [P(0, 0), u, add(u, v), v];
  },
  SQUARE() {
    if (Math.random() < 0.5) { const a = ri(3, 5); return [P(0, 0), P(a, 0), P(a, a), P(0, a)]; }
    const [p, q] = pick([[3, 1], [1, 3], [2, 2], [3, 2], [2, 3]]);
    const u = P(p, q), v = P(-q, p);
    return [P(0, 0), u, add(u, v), v];
  },
  RHOMBUS() {
    if (Math.random() < 0.5) { const a = ri(2, 4); let b = ri(2, 4); if (a === b) b = a + 1; return [P(0, -b), P(a, 0), P(0, b), P(-a, 0)]; }
    const [u, v] = pick([[P(5, 0), P(3, 4)], [P(5, 0), P(-3, 4)], [P(4, 3), P(0, 5)], [P(3, 4), P(0, 5)], [P(4, -3), P(4, 3)]]);
    return [P(0, 0), u, add(u, v), v];
  },
  TRAP() {
    const t = ri(2, 6); let b = ri(3, 8); if (t === b) b += 2;
    const h = ri(2, 4), off = ri(-1, b - t + 1);
    let vs = [P(off, 0), P(off + t, 0), P(b, h), P(0, h)];
    if (Math.random() < 0.3) vs = flipY(vs);
    if (Math.random() < 0.3) vs = transpose(vs);
    return vs;
  },
  ISO_TRAP() {
    const b = ri(5, 8), s = ri(1, Math.floor((b - 2) / 2)), h = ri(2, 4);
    let vs = [P(s, 0), P(b - s, 0), P(b, h), P(0, h)];
    if (Math.random() < 0.5) vs = flipY(vs);
    if (Math.random() < 0.3) vs = transpose(vs);
    return vs;
  },
  KITE() {
    const w = ri(2, 3), t = ri(1, 3); let bb = ri(3, 5); if (bb === t) bb++;
    let vs = [P(0, 0), P(w, t), P(0, t + bb), P(-w, t)];
    if (Math.random() < 0.5) vs = flipY(vs);
    if (Math.random() < 0.5) vs = transpose(vs);
    return vs;
  },
  QUAD() { return [P(ri(-4, -1), ri(-4, -1)), P(ri(1, 4), ri(-4, -1)), P(ri(1, 4), ri(1, 4)), P(ri(-4, -1), ri(1, 4))]; },
  NEAR_PARA(o) {
    const vs = RAW.PARA({ big: o.big });
    const k = ri(0, 3);
    if (o.subtle) {
      if (Math.random() < 0.6) {          // 꼭짓점을 이웃 꼭짓점 기준으로 2~3° 돌리기 → 평행 0쌍
        const deg = (2 + Math.random()) * pick([-1, 1]);
        vs[k] = rotP(vs[k], deg * Math.PI / 180, vs[(k + 3) % 4]);
      } else {                            // 변을 살짝 늘이기 → 평행 1쌍
        const d = sub(vs[k], vs[(k + 3) % 4]);
        vs[k] = add(vs[k], mul(d, 0.08 + Math.random() * 0.05));
      }
      return vs;
    }
    vs[k] = add(vs[k], pick([P(1, 0), P(-1, 0), P(0, 1), P(0, -1)]));   // 모눈 1칸 이동
    return vs;
  },
};

function genShape(type, o = {}) {
  for (let tries = 0; tries < 400; tries++) {
    const vs = normalize(RAW[type](o));
    if (!isConvex(vs)) continue;
    if (Math.min(...[0, 1, 2, 3].map(i => angleAt(vs, i))) < 26) continue;
    const f = pairFlags(vs), n = f.filter(Boolean).length, want = TYPE_INFO[type].pairs;
    if (want >= 0 ? n !== want : n >= 2) continue;
    if (type === 'PARA') {
      if (Math.abs(angleAt(vs, 0) - 90) < 1e-6) continue;                          // 직사각형 제외
      if (Math.abs(len(sub(vs[1], vs[0])) - len(sub(vs[3], vs[0]))) < 1e-6) continue; // 마름모 제외
    }
    // 평행하지 않은 쌍은 눈으로도 구분될 만큼 (NEAR_PARA는 일부러 미세하게)
    if (type !== 'NEAR_PARA') {
      const minDiff = type === 'QUAD' && o.obvious ? 15 : 7;
      if ([0, 1].some(p => !f[p] && pairAngleDiff(vs, p) < minDiff)) continue;
    }
    const w = Math.max(...vs.map(p => p.x)), h = Math.max(...vs.map(p => p.y));
    if (w > (o.maxW || 12) || h > (o.maxH || 9)) continue;
    if (o.avoid && o.avoid.has(sig(vs))) continue;
    return vs;
  }
  // 크기·중복 조건이 너무 빡빡하면 조건을 풀어서 다시 만든다 (게임이 멈추지 않도록)

    g.beginPath();

    else if (f === 'ouch') { g.strokePath(); g.fillStyle(C.ink, 1).fillCircle(cen.x, my + r * 0.2, r * 0.45); return; }
    else g.arc(cen.x, my - r * 0.3, r * 0.75, Math.PI * 0.15, Math.PI * 0.85, false);
    g.strokePath();
    if (f === 'tongue') g.fillStyle(0xff6f91, 1).fillEllipse(cen.x, my + r * 0.6, r * 0.8, r * 0.9);   // 메롱
  }
  pairColor(p) {
    if (this.answerMode) { const k = [0, 1].filter(i => this.q.pairs[i]).indexOf(p); return k < 0 ? null : (k === 0 ? 'red' : 'blue'); }
    if (this.marks.red === p) return 'red';
    if (this.marks.blue === p) return 'blue';
    return null;
  }
  extend(edges, color = C.gray, dur = 750) {
    return new Promise(res => {
      edges.forEach(e => { this.ext[e] = { p: 0, color }; });
      this.scene.tweens.addCounter({ from: 0, to: 1, duration: dur, ease: 'Sine.easeOut',
        onUpdate: t => edges.forEach(e => { if (this.ext[e]) this.ext[e].p = t.getValue(); }), onComplete: () => res() });
    });
  }
  edgeAt(x, y, th = 24) {
    const S = this.S; let best = null, bd = th;
    for (let i = 0; i < 4; i++) { const d = distSeg(P(x, y), S[i], S[(i + 1) % 4]); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  contains(x, y) { const r = this.rect; return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
  draw() {
    const S = this.S = this.q.verts.map(p => this.toS(p));
    const g = this.g, u = this.under, ov = this.over, R = this.rect, lw = this.o.lineW;
    g.clear(); u.clear(); ov.clear();
    const pulse = (Math.sin(this.scene.time.now / 140) + 1) / 2;
    if (this.showGrid) {
      u.lineStyle(1.5, C.gridLine, 0.8);
      const Rs = Math.hypot(R.w, R.h) / 2 / this.unit + 1;
      const x0 = Math.floor(this.c.x - Rs), x1 = Math.ceil(this.c.x + Rs), y0 = Math.floor(this.c.y - Rs), y1 = Math.ceil(this.c.y + Rs);
      for (let x = x0; x <= x1; x++) { const a = this.toS(P(x, y0)), b = this.toS(P(x, y1)); u.lineBetween(a.x, a.y, b.x, b.y); }
      for (let y = y0; y <= y1; y++) { const a = this.toS(P(x0, y)), b = this.toS(P(x1, y)); u.lineBetween(a.x, a.y, b.x, b.y); }
    }
    for (const k in this.ext) {
      const e = +k, ex = this.ext[e], a = S[e], b = S[(e + 1) % 4], d = unitV(sub(b, a)), L = ex.p * 1800;
      dashed(u, add(a, mul(d, -L)), add(b, mul(d, L)), ex.color, Math.max(3, lw - 3));
    }
    this.meetTexts.forEach(t => t.setVisible(false));
    [0, 1].forEach(p => {
      const [e1, e2] = PAIR_EDGES[p], x1 = this.ext[e1], x2 = this.ext[e2];
      if (!x1 || !x2 || x1.p < 0.999 || x2.p < 0.999 || this.q.pairs[p]) return;
      const I = lineIntersect(S[e1], S[(e1 + 1) % 4], S[e2], S[(e2 + 1) % 4]);
      if (!I || I.x < R.x + 8 || I.x > R.x + R.w - 8 || I.y < R.y + 8 || I.y > R.y + R.h - 8) return;
      ov.fillStyle(C.orange, 0.3).fillCircle(I.x, I.y, 16 + 8 * pulse);
      ov.fillStyle(C.orange, 1).fillCircle(I.x, I.y, 8);
      if (this.o.labels) this.meetTexts[p].setPosition(I.x, I.y).setVisible(true);
    });
    g.fillStyle(this.o.fill, this.o.fillAlpha).fillPoints(S, true);
    if (this.face) this.drawFace(g, S);   // 얼굴은 변보다 먼저 그려 변(판별의 단서)을 가리지 않게
    for (let i = 0; i < 4; i++) {
      const a = S[i], b = S[(i + 1) % 4], col = this.pairColor(i % 2);
      if (this.selected === i) { g.lineStyle(lw + 14, C.yellow, 0.55 + 0.4 * pulse); g.lineBetween(a.x, a.y, b.x, b.y); }
      if (this.highlight && this.highlight.includes(i)) { g.lineStyle(lw + 16, C.yellow, 0.25 + 0.65 * pulse); g.lineBetween(a.x, a.y, b.x, b.y); }
      if (col && this.answerMode) { g.lineStyle(lw + 12, col === 'red' ? C.red : C.blue, 0.15 + 0.3 * pulse); g.lineBetween(a.x, a.y, b.x, b.y); }
      g.lineStyle(col ? lw + 2 : lw, col ? (col === 'red' ? C.red : C.blue) : C.ink, 1);
      g.lineBetween(a.x, a.y, b.x, b.y);
    }
    g.fillStyle(C.ink, 1); S.forEach(s => g.fillCircle(s.x, s.y, lw / 2 + 1.5));
    for (let i = 0; i < 4; i++) {
      const col = this.pairColor(i % 2); if (!col) continue;
      const [ia, ib] = EDGE_DIR[i];
      drawChevrons(g, S[ia], S[ib], col === 'red' ? 1 : 2, col === 'red' ? C.redD : C.blueD, lw);
    }
    if (this.labels.length) {
      const on = this.labelsOn !== false;
      this.labels.forEach(t => t.setVisible(on));
      const cen = mul(S.reduce((acc, s) => add(acc, s), P(0, 0)), 0.25);
      this.labels.forEach((t, i) => { const d = unitV(sub(S[i], cen)); t.setPosition(S[i].x + d.x * this.o.labelSize, S[i].y + d.y * this.o.labelSize); });
    }
  }
  setVisible(b) { [this.under, this.g, this.over, ...this.labels].forEach(o => o.setVisible(b)); if (!b) this.meetTexts.forEach(t => t.setVisible(false)); }
  destroy() { [this.under, this.g, this.over, this.maskG, ...this.labels, ...this.meetTexts].forEach(o => o.destroy()); }
}

function drawBg(scene) {

  let x = 0;
  while (x < W) {
    const w = 60 + ((x * 7) % 50), h = 70 + ((x * 13) % 140);
    g.fillStyle(0x8fb8de, 0.16).fillRect(x, H - h, w, h);
    for (let yy = H - h + 14; yy < H - 20; yy += 26) for (let xx = x + 10; xx < x + w - 16; xx += 20) para(g, xx, yy, 10, 12, 3, 0xffffff, false);
    x += w + 14;

  for (let i = 0; i < 4; i++) {

function burst(scene, x, y, colors = [C.red, C.blue, C.yellow, C.green, 0xb48cff], n = 22) {

      scale: { from: 1.5, to: 0.4 }, duration: ri(600, 1000), ease: 'Cubic.easeOut', onComplete: () => g.destroy() });

function shootBeam(scene, from, to, color = C.red) {
  return new Promise(res => {
    sfx.whoosh();
    const c = scene.add.container(from.x, from.y).setDepth(85), g = scene.add.graphics();
    g.fillStyle(color).fillRect(-20, -7, 32, 14); g.fillStyle(0xffd0c8).fillTriangle(12, -7, 12, 7, 26, 0);
    g.lineStyle(2, C.ink).strokeRect(-20, -7, 32, 14);
    c.add(g).setRotation(Math.atan2(to.y - from.y, to.x - from.x));
    const trail = scene.time.addEvent({ delay: 25, loop: true, callback: () => {
      const d = scene.add.circle(c.x, c.y, ri(4, 9), pick([color, C.yellow, 0xffffff]), 0.9).setDepth(84);
      scene.tweens.add({ targets: d, alpha: 0, scale: 0.2, duration: 380, onComplete: () => d.destroy() });
    } });
    scene.tweens.add({ targets: c, x: to.x, y: to.y, duration: 380, ease: 'Quad.easeIn', onComplete: () => {
      trail.remove(); c.destroy(); burst(scene, to.x, to.y, [C.yellow, 0xffffff, color], 12); res();
    } });
  });
}
function stampAt(scene, x, y, text, color, r) {

  return c;
}

    this.bar = scene.add.graphics().setDepth(30);
    this.bubble = scene.add.container(cfg.bubbleX, cfg.bubbleY).setDepth(75).setVisible(false);
    this.bubbleG = scene.add.graphics();
    this.bubbleT = txt(scene, 0, 0, '', 20, '#4a2a8a', { align: 'center', wordWrap: { width: 220, useAdvancedWrap: true } }).setOrigin(0.5);
    this.bubble.add([this.bubbleG, this.bubbleT]);
    this.drawBar();
  }
  pos() { return P(this.cfg.x, this.cfg.y); }
  drawBar() {
    const c = this.cfg, g = this.bar, f = Math.max(0, this.shown / this.maxHp);
    g.clear();
    g.fillStyle(0x1b2340, 0.15).fillRoundedRect(c.barX, c.barY, c.barW, 16, 8);
    if (f > 0.01) g.fillStyle(f > 0.5 ? 0xb48cff : (f > 0.25 ? C.orange : C.red)).fillRoundedRect(c.barX, c.barY, Math.max(16, c.barW * f), 16, 8);
    g.lineStyle(2, C.ink, 0.6).strokeRoundedRect(c.barX, c.barY, c.barW, 16, 8);
  }
  talk(s, dur = 2000) {
    const sc = this.scene, c = this.cfg;
    this.bubbleT.setText(s);
    const w = this.bubbleT.width + 30, h = this.bubbleT.height + 20, g = this.bubbleG;
    const d = unitV(sub(P(c.x, c.y), P(c.bubbleX, c.bubbleY))), B = P(d.x * (w / 2 - 12), d.y * (h / 2 - 6)), T = add(B, mul(d, 26)), p = mul(P(-d.y, d.x), 9);
    g.clear();
    g.fillStyle(0xffffff, 0.97).fillTriangle(B.x + p.x, B.y + p.y, B.x - p.x, B.y - p.y, T.x, T.y);
    g.lineStyle(3, 0xb48cff).strokeTriangle(B.x + p.x, B.y + p.y, B.x - p.x, B.y - p.y, T.x, T.y);
    g.fillStyle(0xffffff, 0.97).fillRoundedRect(-w / 2, -h / 2, w, h, 14);
    g.lineStyle(3, 0xb48cff).strokeRoundedRect(-w / 2, -h / 2, w, h, 14);
    this.bubble.setVisible(true).setScale(0.5);
    sc.tweens.add({ targets: this.bubble, scale: 1, duration: 200, ease: 'Back.easeOut' });
    if (this.hideEv) this.hideEv.remove();
    this.hideEv = sc.time.delayedCall(dur, () => this.bubble.setVisible(false));
  }
  hit(n, line) {
    const sc = this.scene, c = this.cfg;
    this.hp = Math.max(0, this.hp - n);
    sfx.hit();
    sc.tweens.addCounter({ from: this.shown, to: this.hp, duration: 450, onUpdate: t => { this.shown = t.getValue(); this.drawBar(); } });
    sc.tweens.add({ targets: this.v, x: c.x + 10, duration: 45, yoyo: true, repeat: 4, onComplete: () => { this.v.x = c.x; } });
    sc.tweens.add({ targets: this.v, scaleX: 1.3, scaleY: 0.7, duration: 90, yoyo: true });
    floatText(sc, c.x, c.y - 40 * c.s, `-${n}`, '#d63b2f');
    if (line !== false) this.talk(line || pick(HIT_FAKE));
  }
  laugh(line) {
    const sc = this.scene, y0 = this.cfg.y;
    sfx.laugh();
    sc.tweens.add({ targets: this.v, y: y0 - 16, duration: 110, yoyo: true, repeat: 2, onComplete: () => { this.v.y = y0; } });
    this.talk(line || pick(LAUGH));
  }
  ko() {
    const sc = this.scene;
    this.talk('으아아~ 기억해 두겠다!', 2600);
    sc.tweens.killTweensOf(this.v);
    sc.tweens.add({ targets: this.v, x: sc.scale.width + 160, y: this.v.y - 90, angle: 900, duration: 1300, delay: 500, ease: 'Cubic.easeIn' });
  }
}

function topBar(scene, title, h) {
  const W = scene.scale.width, g = scene.add.graphics().setDepth(10);
  g.fillStyle(0xffffff, 0.88).fillRect(0, 0, W, h);
  g.lineStyle(3, C.ink, 0.15).lineBetween(0, h, W, h);
  const portrait = scene.scale.height > W, fs = portrait ? 24 : 28, cy = h / 2;
  txt(scene, 16, cy, title, fs).setOrigin(0, 0.5).setDepth(11);
  const prog = txt(scene, portrait ? W * 0.45 : W * 0.5, cy, '', fs).setOrigin(0.5).setDepth(11);
  const score = txt(scene, portrait ? W * 0.64 : W * 0.68, cy, '', fs, '#b8860b').setOrigin(0.5).setDepth(11);
  const [bw, bh] = smallBtnSize(scene);
  makeMuteBtn(scene, W - 12 - bw * 1.5 - 8, cy).setDepth(11);
  new Btn(scene, W - 12 - bw / 2, cy, bw, bh, '⏸', { fontSize: 26, onClick: () => openPause(scene) }).setDepth(11);
  return { prog, score };
}

    const go = mode => {

function buildBottom(scene, L, withJudge) {
  const r = L.bottom, g = scene.add.graphics();
  g.fillStyle(0xffffff, 0.85).fillRoundedRect(r.x, r.y, r.w, r.h, 22);
  g.lineStyle(3, C.ink, 0.2).strokeRoundedRect(r.x, r.y, r.w, r.h, 22);
  let msgBox, jb;
  const paraPos = L.portrait ? P(r.x + 74, r.y + 100) : P(r.x + 70, r.y + r.h / 2 - 4);
  if (!L.portrait) {
    makePara(scene, r.x + 70, r.y + r.h / 2 - 4, 0.72);
    msgBox = { x: r.x + 140, y: r.y + 12, w: withJudge ? 640 : r.w - 160, h: r.h - 24 };
    jb = { y: r.y + r.h / 2, x1: r.x + r.w - 350, x2: r.x + r.w - 118, w: 220, h: 108 };
  } else {
    makePara(scene, r.x + 74, r.y + 100, 0.8);
    msgBox = { x: r.x + 150, y: r.y + 14, w: r.w - 164, h: withJudge ? 196 : r.h - 28 };
    jb = { y: r.y + r.h - 70, x1: r.x + r.w * 0.25 + 4, x2: r.x + r.w * 0.75 - 4, w: 320, h: 108 };
  }
  // 말풍선: 정답이면 초록, 오답이면 빨강으로 바뀐다
  const boxG = scene.add.graphics();
  const ty = L.portrait ? msgBox.y + 30 : msgBox.y + msgBox.h / 2;
  const drawBox = mood => {
    const fill = mood === 'good' ? 0xdff8e8 : mood === 'bad' ? 0xffe1dd : 0xf3f8ff;
    const line = mood === 'good' ? C.green : mood === 'bad' ? C.red : C.ink;
    boxG.clear();
    boxG.fillStyle(fill, 1).fillRoundedRect(msgBox.x, msgBox.y, msgBox.w, msgBox.h, 16);
    boxG.lineStyle(mood ? 4 : 2, line, mood ? 0.9 : 0.25).strokeRoundedRect(msgBox.x, msgBox.y, msgBox.w, msgBox.h, 16);
    boxG.fillStyle(fill, 1).fillTriangle(msgBox.x + 2, ty - 12, msgBox.x + 2, ty + 12, msgBox.x - 14, ty);
  };
  drawBox(null);
  const msg = txt(scene, msgBox.x + 18, msgBox.y + msgBox.h / 2, '', L.portrait ? 25 : 22, C.inkS, { wordWrap: { width: msgBox.w - 34, useAdvancedWrap: true }, lineSpacing: 5 }).setOrigin(0, 0.5);
  const say = (s, mood = null) => {
    drawBox(mood);
    msg.setText(s).setColor(mood === 'good' ? '#17673f' : mood === 'bad' ? '#a3231c' : C.inkS);
    scene.tweens.killTweensOf(msg);
    scene.tweens.add({ targets: msg, x: { from: msgBox.x + 26, to: msgBox.x + 18 }, duration: 160 });
  };
  return { say, jb, msgBox, paraPos };
}

function drawFacade(scene, F, cols, rows, stageIdx) {
  const g = scene.add.graphics();
  g.fillStyle(0x1b2340, 0.12).fillRect(F.x + 10, F.y + 10, F.w, F.h);
  g.fillStyle([0xffe9c7, 0xfff6d6, 0xe8e0ff][stageIdx] || 0xffe9c7).fillRect(F.x, F.y, F.w, F.h);
  g.lineStyle(5, C.ink).strokeRect(F.x, F.y, F.w, F.h);
  g.fillStyle(0x5b6787).fillRect(F.x - 20, F.y - 26, F.w + 40, 28);
  g.lineStyle(4, C.ink).strokeRect(F.x - 20, F.y - 26, F.w + 40, 28);
  // 벽돌 무늬
  g.lineStyle(2, 0x1b2340, 0.07);
  for (let yy = F.y + 18, row = 0; yy < F.y + F.h; yy += 22, row++) {
    g.lineBetween(F.x + 3, yy, F.x + F.w - 3, yy);
    for (let xx = F.x + (row % 2 ? 22 : 0); xx < F.x + F.w; xx += 44) g.lineBetween(xx, yy, xx, Math.min(yy + 22, F.y + F.h - 3));
  }
  const pad = 16, cw = (F.w - pad * (cols + 1)) / cols, ch = (F.h - pad * (rows + 1)) / rows, wins = [];
  const sillH = Math.max(14, Math.min(22, ch * 0.1));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = F.x + pad + c * (cw + pad), y = F.y + pad + r * (ch + pad);
    g.fillStyle(0x5b6787).fillRoundedRect(x - 5, y - 5, cw + 10, ch + 10, 12);
    g.fillStyle(0x2d3a5c).fillRoundedRect(x, y, cw, ch, 10);                 // 어두운 창 안쪽 (부품이 숨어 있는 곳)
    g.fillStyle(0x3d4c74).fillRoundedRect(x + 6, y + 6, cw - 12, ch * 0.35, 8);
    const light = scene.add.graphics().setDepth(2).setVisible(false);
    light.fillStyle(0xfffbe8, 1).fillRoundedRect(x, y, cw, ch, 10);
    light.lineStyle(5, C.yellow, 1).strokeRoundedRect(x - 2, y - 2, cw + 4, ch + 4, 12);
    // 창턱: 부품보다 앞에 그려서 부품이 창턱 뒤에서 쑥 올라오는 것처럼 보이게
    const sill = scene.add.graphics().setDepth(10.5);
    sill.fillStyle(0x1b2340, 0.25).fillRoundedRect(x - 10, y + ch - sillH + 6, cw + 20, sillH, 6);
    sill.fillStyle(0xe9edf6).fillRoundedRect(x - 12, y + ch - sillH, cw + 24, sillH, 6);
    sill.fillStyle(0xffffff, 0.8).fillRect(x - 8, y + ch - sillH + 3, cw + 16, 3);
    sill.lineStyle(3, C.ink).strokeRoundedRect(x - 12, y + ch - sillH, cw + 24, sillH, 6);
    wins.push({ x, y, w: cw, h: ch, cx: x + cw / 2, cy: y + ch / 2, sillY: y + ch - sillH,
      inner: { x: x + 16, y: y + 16, w: cw - 32, h: ch - 26 - sillH }, light, pop: null });
  }
  return wins;
}
// 창턱 뒤에서 통통 튀며 올라온다 (늘어났다가 탄력 있게 제자리)
function popShape(scene, win, q, grid, answerMode = false) {
  const v = new ShapeView(scene, q, win.inner, { labels: false, lineW: 5, grid: grid && q.rot === 0, maxUnit: 40, pad: 0.9,
    circleFit: q.rot !== 0, fill: 0xffffff, depth: 8, clip: true, face: true });
  v.answerMode = answerMode;
  const cy0 = v.cy, R = Math.max(...q.verts.map(p => len(sub(p, v.c)))) * v.unit;
  v.cy = win.sillY + R + 6; v.sx = 0.8; v.sy = 1.3;
  scene.tweens.add({ targets: v, cy: cy0, duration: 280, ease: 'Back.easeOut' });
  scene.tweens.add({ targets: v, sx: 1, sy: 1, duration: 650, delay: 120, ease: 'Elastic.easeOut' });
  dust(scene, win.cx, win.sillY, win.w);
  win.light.setVisible(true);
  sfx.rise();
  return v;
}
// smash: 납작하게 찌그러졌다가 쏙 / 아니면 그냥 창턱 뒤로 쏙
function hideShape(scene, v, smash) {
  const R = Math.max(...v.q.verts.map(p => len(sub(p, v.c)))) * v.unit, down = v.rect.y + v.rect.h + R + 10;
  return new Promise(res => {
    const sink = () => scene.tweens.add({ targets: v, cy: down, duration: smash ? 260 : 220, ease: 'Back.easeIn',
      onUpdate: () => v.draw(), onComplete: () => { v.destroy(); res(); } });
    if (!smash) { sfx.sink(); sink(); return; }
    scene.tweens.add({ targets: v, sy: 0.35, sx: 1.45, duration: 80, ease: 'Quad.easeOut', onUpdate: () => v.draw(),
      onComplete: () => scene.time.delayedCall(260, sink) });
  });
}
function flashWin(scene, w, ok) {
  const r = scene.add.rectangle(w.cx, w.cy, w.w + 10, w.h + 10, ok ? C.green : C.red, 0.45).setDepth(24);
  r.setStrokeStyle(8, ok ? C.green : C.red, 1);
  scene.tweens.add({ targets: r, alpha: 0, duration: 800, ease: 'Quad.easeIn', onComplete: () => r.destroy() });
  if (!ok) scene.cameras.main.shake(260, 0.008);
}
// 창턱에서 피어오르는 먼지
function dust(scene, x, y, w) {
  for (let i = 0; i < 6; i++) {
    const c = scene.add.circle(x + (Math.random() - 0.5) * w * 0.7, y, ri(5, 10), 0xffffff, 0.8).setDepth(11);
    scene.tweens.add({ targets: c, y: y - ri(10, 28), x: c.x + ri(-14, 14), scale: { from: 0.6, to: 1.6 }, alpha: 0, duration: ri(350, 550), onComplete: () => c.destroy() });
  }
}
// 만화 효과 글자: 퍽! 쾅! 뿅!
const HIT_WORDS = ['퍽!', '쾅!', '뿅!', '딱!', '명중!'];
function comicHit(scene, x, y, word, color = 0xffd84d) {
  const c = scene.add.container(x, y).setDepth(70), g = scene.add.graphics();
  const pts = [];
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r = i % 2 ? 26 : 50; pts.push(P(Math.cos(a) * r, Math.sin(a) * r)); }
  g.fillStyle(color, 1).fillPoints(pts, true); g.lineStyle(4, C.ink, 1).strokePoints(pts, true);
  c.add([g, txt(scene, 0, 0, word, 30, '#e8453c', { stroke: '#ffffff', strokeThickness: 6 }).setOrigin(0.5)]);
  c.setScale(0.2).setAngle(ri(-20, 20));
  scene.tweens.add({ targets: c, scale: 1.1, duration: 140, ease: 'Back.easeOut',
    onComplete: () => scene.tweens.add({ targets: c, alpha: 0, scale: 1.3, delay: 220, duration: 220, onComplete: () => c.destroy() }) });
}
// 맞은 부품 머리 위로 빙글빙글 도는 별
function dizzyStars(scene, x, y) {
  const stars = [0, 1, 2].map(() => txt(scene, x, y, '⭐', 22).setOrigin(0.5).setDepth(65));
  scene.tweens.addCounter({ from: 0, to: Math.PI * 4, duration: 700, onUpdate: t => {
    const a = t.getValue(); stars.forEach((s, i) => { const b = a + i * Math.PI * 2 / 3; s.setPosition(x + Math.cos(b) * 30, y + Math.sin(b) * 9); });
  }, onComplete: () => stars.forEach(s => s.destroy()) });
}
function catchFx(scene, w, real = false) {
  sfx.bonk(); scene.time.delayedCall(90, () => sfx.ding());
  const v = w.pop && w.pop.view;
  if (v) v.face = 'dizzy';
  comicHit(scene, w.cx + ri(-20, 20), w.y + w.h * 0.35, pick(HIT_WORDS));
  dizzyStars(scene, w.cx, w.y + 18);
  burst(scene, w.cx, w.cy, undefined, 16);
  flashWin(scene, w, true);
  scene.cameras.main.shake(90, 0.004);
  return stampAt(scene, w.cx, w.cy + w.h * 0.12, real ? '진짜!' : '가짜!', real ? C.green : C.red, Math.min(w.w, w.h) * 0.26);
}
// 뿅망치: 컴퓨터에서는 마우스를 따라다니고, 터치하면 그 자리에서 휘두른다
function makeHammer(scene) {
  const c = scene.add.container(-200, -200).setDepth(300), g = scene.add.graphics();
  g.fillStyle(0xc8874a).fillRoundedRect(-6, -72, 12, 76, 5); g.lineStyle(3, C.ink).strokeRoundedRect(-6, -72, 12, 76, 5);
  g.fillStyle(0xff5a5a).fillRoundedRect(-36, -104, 72, 38, 14); g.lineStyle(4, C.ink).strokeRoundedRect(-36, -104, 72, 38, 14);
  g.fillStyle(0xffd84d).fillRoundedRect(-44, -107, 14, 44, 6).fillRoundedRect(30, -107, 14, 44, 6);
  g.lineStyle(3, C.ink).strokeRoundedRect(-44, -107, 14, 44, 6).strokeRoundedRect(30, -107, 14, 44, 6);
  g.fillStyle(0xffffff, 0.6).fillRoundedRect(-26, -98, 40, 8, 4);
  c.add(g).setAngle(-28).setVisible(false);
  // 망치 머리(0,-85)가 가리키는 점에 오도록 위치를 잡는다
  const place = (x, y) => c.setPosition(x + 10, y + 85);
  scene.input.on('pointermove', p => { if (!p.wasTouch) { place(p.x, p.y); c.setVisible(true); } });
  scene.input.setDefaultCursor('none');
  scene.events.once('shutdown', () => scene.input.setDefaultCursor('default'));
  c.swing = p => {
    place(p.x, p.y); c.setVisible(true);
    scene.tweens.killTweensOf(c);
    c.setAngle(-55);
    scene.tweens.add({ targets: c, angle: 8, duration: 70, ease: 'Quad.easeIn',
      onComplete: () => scene.tweens.add({ targets: c, angle: -28, duration: 170, ease: 'Back.easeOut',
        onComplete: () => { if (p.wasTouch) scene.time.delayedCall(250, () => c.setVisible(false)); } }) });
  };
  return c;
}

class PlayScene extends Phaser.Scene {
  constructor() { super('PlayScene'); }
  init(d) {
    this.stageIdx = Math.min((d && d.stage) || 0, STAGES.length - 1);
    this.cfg = STAGES[this.stageIdx]; this.wk = WHACK[this.stageIdx];
    this.tgt = this.cfg.target;   // 'fake' = 가짜를 잡는다, 'real' = 진짜를 잡는다(규칙 반전)
    this.tw = targetWord(this.cfg);
  }
  create() {
    const W = this.W = this.scale.width, H = this.H = this.scale.height, L = this.L = whackLayout(W, H);
    drawBg(this);
    RUN = { stage: this.stageIdx, score: 0, wrongByType: {}, wrongList: [], caught: 0, mistakes: 0, missed: 0, combo: 0, maxCombo: 0, ko: 0, overloads: 0, stars: 1 };
    this.paused = false; this.state = 'ready'; this.ended = false;
    this.frozen = 0; this.frozenWin = null; this.elapsed = 0; this.nextSpawn = 500; this.fever = 0; this.hearts = 3;
    this.lastSec = null; this.offStreak = 0; this.lastWin = null; this.helpPhase = -1; this.locked = false;
    const tb = topBar(this, `${this.cfg.icon} ${this.cfg.no}단계 ${this.cfg.name}`, L.top);
    this.progText = tb.prog; this.scoreText = tb.score;
    this.progText.setText(`⏱ ${ROUND_SEC}초`);
    this.F = L.facade;
    const [cols, rows] = this.wk.win[L.portrait ? 'port' : 'land'];
    this.wins = drawFacade(this, L.facade, cols, rows, this.stageIdx);
    // 이번 단계 규칙을 늘 보이게 (2단계는 규칙이 반대라서 특히 중요)
    const rule = `🎯 ${this.tw}만 톡!`;
    if (L.portrait) txt(this, 330, 200, rule, 24, this.tgt === 'real' ? '#1f8f57' : '#d63b2f', { stroke: '#ffffff', strokeThickness: 5 }).setOrigin(0, 0.5).setDepth(12);
    else txt(this, 75, 480, `🎯\n${this.tw}만\n톡!`, 26, this.tgt === 'real' ? '#1f8f57' : '#d63b2f', { stroke: '#ffffff', strokeThickness: 5, align: 'center' }).setOrigin(0.5).setDepth(12);
    this.wins.forEach(w => this.add.zone(w.cx, w.cy, w.w, w.h).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.tapWin(w)));
    this.timerG = this.add.graphics().setDepth(12);
    this.feverG = this.add.graphics().setDepth(11);
    const hp = L.hearts;
    this.heartT = [0, 1, 2].map(i => txt(this, hp.vertical ? hp.x : hp.x + i * hp.dx, hp.vertical ? hp.y + i * hp.dy : hp.y, '❤️', 44)
      .setOrigin(hp.vertical ? 0.5 : 0, 0.5).setDepth(12));
    this.comboT = txt(this, L.combo.x, L.combo.y, '', 28, '#e8453c', { stroke: '#ffffff', strokeThickness: 6, align: 'center' })
      .setOrigin(L.portrait ? 0 : 0.5, 0.5).setDepth(12);
    this.hud = new VillainHud(this, L.hud, this.wk.ko);
    const b = buildBottom(this, L, false);
    this.say = b.say; this.paraPos = b.paraPos;
    this.hammer = makeHammer(this);
    this.input.on('pointerdown', p => this.hammer.swing(p));
    this.drawTimer(ROUND_SEC);
    this.updateHud();
    const other = this.tgt === 'real' ? '가짜' : '진짜';
    this.say(`😈 ${this.cfg.intro}\n${this.tw} 평행사변형만 톡! ${other}를 누르거나 ${this.tw}를 놓치면 ❤️가 줄어요. 60초 동안 최대한 많이!`);
    this.countdown();
  }
  countdown() {
    // 시작 전에 이번 규칙을 크게 보여 준다
    banner(this, this.tgt === 'real' ? '🏛️ 이번엔 진짜를 잡아요!' : '🎯 가짜를 잡아요!', this.tgt === 'real' ? '#1f8f57' : '#d63b2f', 60);
    const steps = ['3', '2', '1', '시작!'], d0 = 1300;
    this.time.delayedCall(steps.length * 700 - 250 + d0, () => { if (!this.ended) this.state = 'play'; });
    steps.forEach((s, i) => this.time.delayedCall(d0 + i * 700, () => {
      const t = txt(this, this.W / 2, this.H * 0.45, s, i < 3 ? 130 : 96, i < 3 ? C.inkS : '#1f8f57', { stroke: '#ffffff', strokeThickness: 14 })
        .setOrigin(0.5).setDepth(90).setScale(0.3);
      if (i < 3) sfx.tick(); else sfx.combo();
      this.tweens.add({ targets: t, scale: 1, duration: 250, ease: 'Back.easeOut',
        onComplete: () => this.tweens.add({ targets: t, alpha: 0, delay: 250, duration: 180, onComplete: () => t.destroy() }) });
    }));
  }
  update(t, dt) {
    this.wins.forEach(w => { if (w.pop) w.pop.view.draw(); });
    if (this.fever > 0) this.drawFever();
    if (this.state !== 'play' || this.paused) return;
    if (this.frozen > 0) { this.frozen -= dt; if (this.frozen <= 0) this.unfreeze(); return; }
    this.elapsed += dt;
    const d = Math.min(1, this.elapsed / (ROUND_SEC * 1000));
    if (this.fever > 0) { this.fever -= dt; if (this.fever <= 0) { this.feverG.clear(); this.updateHud(); } }
    if (this.wk.help) this.updateHelp();
    // 스캐너 과부하 중에는 시간만 흐르고 부품이 나오거나 사라지지 않는다
    if (!this.locked) this.wins.forEach(w => {
      const p = w.pop; if (!p || p.done) return;
      if (p.spin) p.view.rot += p.spin * dt / 1000;                                   // 2단계: 빙글빙글
      if (p.morphAt != null && !p.morphed && p.left <= p.morphAt) this.morph(w);      // 3단계: 진짜 → 가짜 변신
      p.left -= dt; if (p.left <= 0) this.expire(w);
    });
    this.nextSpawn -= dt;
    const [a0, a1] = this.wk.active;
    const maxActive = d < 0.35 ? a0 : (d < 0.7 ? Math.ceil((a0 + a1) / 2) : a1);
    if (!this.locked && this.nextSpawn <= 0 && this.activeCount() < maxActive) {
      this.spawn(d);
      this.nextSpawn = lerp(this.wk.gap[0], this.wk.gap[1], d) * (this.fever > 0 ? 0.7 : 1) * (0.8 + Math.random() * 0.4);
    }
    const left = ROUND_SEC - this.elapsed / 1000;
    this.drawTimer(left);
    const sec = Math.max(0, Math.ceil(left));
    if (sec !== this.lastSec) {
      this.lastSec = sec; this.progText.setText(`⏱ ${sec}초`);
      if (sec <= 10 && sec > 0) sfx.tick();
      if (sec === 10) { banner(this, '⏰ 10초 남았어요! 서둘러!', '#e8453c', 52); this.tweens.add({ targets: this.progText, scale: { from: 1.5, to: 1 }, duration: 400, ease: 'Back.easeOut' }); }
    }
    if (left <= 0) this.endRound('time');
  }
  activeCount() { return this.wins.filter(w => w.pop && !w.pop.done).length; }
  spawn(d) {
    const free = this.wins.filter(w => !w.pop && w !== this.lastWin);
    if (!free.length) return;
    const w = this.lastWin = pick(free);
    const isTarget = this.offStreak >= 2 ? true : Math.random() < 0.5;    // 잡을 부품이 너무 오래 안 나오지 않게
    this.offStreak = isTarget ? 0 : this.offStreak + 1;
    const answer = isTarget ? this.tgt : (this.tgt === 'real' ? 'fake' : 'real');
    const q = makeQuestion(pick(answer === 'fake' ? this.wk.fakes : this.wk.reals), this.cfg, { obvious: true, subtle: false, big: false, maxW: 7, maxH: 5 });
    const p = w.pop = { q, view: popShape(this, w, q, this.cfg.grid), left: lerp(this.wk.stay[0], this.wk.stay[1], d) * (q.rot ? 1.1 : 1), done: false };
    if (this.wk.help) this.applyHelp(p);
    if (this.wk.spin) p.spin = (0.5 + Math.random() * 0.5) * pick([-1, 1]);   // 초당 회전(라디안)
    // 3단계: 진짜 중 일부는 떠 있는 동안 가짜로 변신한다 — 변신 뒤에도 잡을 시간이 남도록 조금 더 오래 머문다
    if (this.wk.morph && q.answer === 'real' && Math.random() < this.wk.morph) { p.left *= 1.4; p.morphAt = p.left * (0.45 + Math.random() * 0.2); }
    if (Math.random() < 0.12) this.makeBonus(w, p);
    if (q.answer === 'fake' && Math.random() < 0.2) this.hud.talk(pick(TAUNT), 1400);
  }
  // 1단계 도움 단계 (평행 표시 전부 → 한 쌍만 → 없음)
  updateHelp() {
    const ph = HELP_STEPS.filter(h => this.elapsed / 1000 >= h[0]).length - 1;
    if (ph === this.helpPhase) return;
    this.helpPhase = ph;
    if (ph > 0) { banner(this, HELP_STEPS[ph][2].split('!')[0] + '!', '#1446a8', 40); sfx.combo(); }
    this.say(HELP_STEPS[ph][2]);
    this.wins.forEach(w => { if (w.pop && !w.pop.done) this.applyHelp(w.pop); });
  }
  applyHelp(p) {
    const mode = HELP_STEPS[Math.max(0, this.helpPhase)][1], v = p.view, q = p.q;
    v.marks = { red: null, blue: null }; v.answerMode = false;
    if (mode === 'all') v.answerMode = true;
    else if (mode === 'one') {
      const par = [0, 1].filter(i => q.pairs[i]);
      if (par.length) { if (p.helpPair == null) p.helpPair = pick(par); v.marks.red = p.helpPair; }
    }
  }
  // 삐뚤이의 변신: 진짜 평행사변형의 꼭짓점 하나가 모눈 1칸 슬쩍 움직여 가짜가 된다
  morph(w) {
    const p = w.pop, q = p.q;
    p.morphed = true;
    const nv = morphTarget(q.verts);
    if (!nv) return;
    const from = q.verts.map(v => P(v.x, v.y));
    // 판정은 바로 가짜로 바뀐다 (변하는 도중에 눌러도 가짜를 잡은 것)
    q.answer = 'fake'; q.type = 'NEAR_PARA'; q.pairs = pairFlags(nv); q.count = q.pairs.filter(Boolean).length; q.morphed = true;
    p.left = Math.max(p.left, 2400);   // 변신을 보고 잡을 시간을 넉넉히
    sfx.laugh();
    this.hud.talk('히히, 살짝 비틀어야지~', 1300);
    this.tweens.addCounter({ from: 0, to: 1, duration: 900, ease: 'Sine.easeInOut',
      onUpdate: t => { const k = t.getValue(); q.verts = from.map((v, i) => P(lerp(v.x, nv[i].x, k), lerp(v.y, nv[i].y, k))); } });
    const s = this.add.circle(w.cx, w.cy, Math.min(w.w, w.h) * 0.45, 0xb48cff, 0.35).setDepth(20);
    this.tweens.add({ targets: s, alpha: 0, scale: 1.3, duration: 650, onComplete: () => s.destroy() });
  }
  // ✨ 반짝 부품: 맞게 판별하면 +200 보너스 (진짜일 수도, 가짜일 수도 있다)
  makeBonus(w, p) {
    p.bonus = true; sfx.sparkle();
    const ring = this.add.graphics().setDepth(3);
    ring.lineStyle(6, 0xffd84d, 1).strokeRoundedRect(w.x - 6, w.y - 6, w.w + 12, w.h + 12, 14);
    this.tweens.add({ targets: ring, alpha: { from: 1, to: 0.25 }, duration: 260, yoyo: true, repeat: -1 });
    const tag = txt(this, w.x + w.w - 8, w.y + 4, '✨', 30).setOrigin(1, 0).setDepth(12);
    this.tweens.add({ targets: tag, angle: { from: -15, to: 15 }, scale: { from: 0.9, to: 1.2 }, duration: 300, yoyo: true, repeat: -1 });
    p.fx = [ring, tag];
  }
  clearWin(w) { if (w.pop && w.pop.fx) w.pop.fx.forEach(o => o.destroy()); w.pop = null; w.light.setVisible(false); }
  tapWin(w) {
    if (this.state !== 'play' || this.paused || this.frozen > 0 || this.locked) return;
    const p = w.pop;
    if (!p || p.done) { sfx.thud(); dust(this, w.cx, w.sillY, w.w * 0.6); return; }   // 빈 창문: '탁'
    p.done = true;
    if (p.q.answer === this.tgt) this.catchTarget(w); else this.mistake(w, 'wrong');
  }
  catchTarget(w) {
    const p = w.pop, real = p.q.answer === 'real';
    RUN.caught++; RUN.combo++; RUN.maxCombo = Math.max(RUN.maxCombo, RUN.combo);
    let pts = 100 + Math.min(100, (RUN.combo - 1) * 10);
    if (this.fever > 0) pts *= 2;
    if (p.bonus) { pts += 200; this.time.delayedCall(200, () => { sfx.sparkle(); floatText(this, w.cx, w.cy - 90, '✨ 반짝 보너스 +200', '#e09b00'); }); }
    RUN.score += pts;
    floatText(this, w.cx, w.cy - 40, `+${pts}`);
    const st = catchFx(this, w, real);
    if (real && GS.parts.length < 40) GS.parts.push({ verts: p.q.verts, rot: p.q.rot });   // 박물관에 전시한 진짜 → 엔딩 건물 창문
    shootBeam(this, this.paraPos, this.hud.pos(), real ? C.blue : C.red).then(() => {
      if (this.hud.hp > 0 && !this.ended) this.hud.hit(1, RUN.caught % 3 === 0 ? pick(HIT_FAKE) : false);
    });
    if (RUN.combo % 5 === 0) this.startFever();
    this.updateHud();
    this.time.delayedCall(320, () => hideShape(this, p.view, true).then(() => { st.destroy(); this.clearWin(w); }));
    if (RUN.caught % this.wk.ko === 0) this.time.delayedCall(450, () => this.koVillain());   // 10개마다 KO
  }
  expire(w) {
    const p = w.pop;
    p.done = true;
    if (p.q.answer === this.tgt) { this.mistake(w, 'missed'); return; }
    RUN.score += 20;   // 잡으면 안 되는 부품을 참고 안 누르면 작은 보너스
    if (p.q.answer === 'real' && GS.parts.length < 40) GS.parts.push({ verts: p.q.verts, rot: p.q.rot });   // 엔딩 건물의 창문이 된다
    floatText(this, w.cx, w.cy - 30, '+20 통과', '#5b6787');
    this.updateHud();
    p.view.face = 'happy';
    this.time.delayedCall(180, () => hideShape(this, p.view, false).then(() => this.clearWin(w)));
  }
  // 실수하면 잠깐 멈추고 '왜' 틀렸는지 보여 준다 (변 늘이기 + 평행 표시)
  mistake(w, kind) {
    const q = w.pop.q, v = w.pop.view;
    // kind: 'wrong' = 잡으면 안 되는 부품을 누름, 'missed' = 잡아야 할 부품을 놓침
    if (kind === 'wrong') RUN.mistakes++; else RUN.missed++;
    RUN.combo = 0; this.fever = 0; this.feverG.clear();
    RUN.wrongByType[q.type] = (RUN.wrongByType[q.type] || 0) + 1;
    RUN.wrongList.push(q);
    this.hearts = Math.max(0, this.hearts - 1);
    const ht = this.heartT[this.hearts];
    ht.setText('🤍');
    this.tweens.add({ targets: ht, scale: { from: 1.8, to: 1 }, duration: 400, ease: 'Back.easeOut' });
    sfx.buzz(); flashWin(this, w, false);
    if (kind === 'wrong') { sfx.bonk(); v.face = 'ouch'; v.sy = 0.75; v.sx = 1.2; this.tweens.add({ targets: v, sx: 1, sy: 1, duration: 500, ease: 'Elastic.easeOut' }); comicHit(this, w.cx, w.y + w.h * 0.35, '아야!', 0xffb3b3); }
    else v.face = q.answer === 'fake' ? 'tongue' : 'sad';
    v.answerMode = true;
    v.extend([0, 1].filter(i => !q.pairs[i]).flatMap(i => PAIR_EDGES[i]), C.orange, 500);
    const isReal = q.answer === 'real', word = isReal ? '진짜' : '가짜';
    const label = txt(this, w.cx, w.y + w.h - 4, kind === 'wrong' ? `${word}예요!` : '놓쳤다!', 24, isReal ? '#1f8f57' : '#d63b2f',
      { stroke: '#ffffff', strokeThickness: 6 }).setOrigin(0.5, 1).setDepth(30);
    const name = TYPE_INFO[q.type].name;
    const why = isReal
      ? `${name}${q.type === 'PARA' ? '' : '도 평행사변형'} — 마주 보는 두 쌍의 변이 모두 평행해요. (빨강 >, 파랑 >>)`
      : `${q.morphed ? '삐뚤이가 꼭짓점을 슬쩍 옮겼어요! ' : ''}${name} — ${q.count === 0 ? '평행한 변이 하나도 없어요' : '평행한 변이 한 쌍뿐이에요'}. 주황 선처럼 늘이면 만나요!`;
    this.say(`❌ ${word}를 ${kind === 'wrong' ? '눌렀어요' : '놓쳤어요'}! ${why}`, 'bad');
    this.hud.laugh(kind === 'wrong' ? `히히! 그건 ${word}야~` : '히히, 놓쳤지롱~');
    this.frozenWin = { w, label };
    this.updateHud();
    this.frozen = 1700;
    if (this.hearts <= 0) this.overload();
  }
  // ❤️를 모두 잃으면: 3초 동안 아무것도 못 누르고(시간은 흐름), 하트가 다시 찬다. 별은 1개 깎인다
  overload() {
    RUN.overloads++;
    this.locked = true;   // 바로 잠가서 이유 화면 중에도 다른 부품이 사라지며 하트가 더 줄지 않게
    const F = this.F;
    this.time.delayedCall(1700, () => {
      if (this.ended) return;
      // 열려 있던 다른 창문은 닫고 쉰다
      this.wins.forEach(w => { if (w.pop && !w.pop.done && (!this.frozenWin || this.frozenWin.w !== w)) { w.pop.done = true; hideShape(this, w.pop.view, false).then(() => this.clearWin(w)); } });
      const dim = this.add.rectangle(F.x + F.w / 2, F.y + F.h / 2, F.w, F.h, 0x1b2340, 0.45).setDepth(50);
      const t = txt(this, F.x + F.w / 2, F.y + F.h / 2, '', 38, '#ffffff', { align: 'center', stroke: '#d63b2f', strokeThickness: 8 }).setOrigin(0.5).setDepth(51);
      let left = 3;
      const tick = () => t.setText(`💔 스캐너 과부하!
${left}초 쉬고 다시 시작해요`);
      tick(); sfx.boop();
      this.time.addEvent({ delay: 1000, repeat: 2, callback: () => {
        left--; tick();
        if (left <= 0) {
          dim.destroy(); t.destroy(); this.locked = false;
          this.hearts = 3; this.heartT.forEach(h => h.setText('❤️'));
          this.say('❤️ 하트 회복! 이번엔 진짜와 가짜를 잘 보고 눌러요.');
        }
      } });
    });
  }
  // 삐뚤이 HP를 다 깎으면 KO 보너스 — 판은 계속되고 삐뚤이가 다시 일어난다
  koVillain() {
    if (this.ended) return;
    RUN.ko++;
    RUN.score += 300; this.updateHud();
    sfx.win();
    banner(this, `💥 삐뚤이 KO! +300`, '#7a3fd1', 64);
    burst(this, this.hud.cfg.x, this.hud.cfg.y, undefined, 30);
    this.hud.talk('으으… 아직 안 끝났어! 다시 간다!', 2200);
    this.time.delayedCall(900, () => { this.hud.hp = this.hud.maxHp; this.hud.shown = this.hud.maxHp; this.hud.drawBar(); });
  }
  unfreeze() {
    const f = this.frozenWin; this.frozenWin = null;
    if (!f) return;
    f.label.destroy();
    hideShape(this, f.w.pop.view, false).then(() => this.clearWin(f.w));
    this.say(`계속! ${this.tw} 평행사변형만 톡!`);
  }
  startFever() {
    this.fever = 6000;
    sfx.combo();
    banner(this, '🔥 피버 타임! 점수 2배', '#e8453c', 56);
    this.updateHud();
  }
  drawFever() {
    const F = this.F, g = this.feverG, k = (Math.sin(this.time.now / 90) + 1) / 2;
    g.clear();
    g.lineStyle(10, [C.red, C.orange, C.yellow][Math.floor(this.time.now / 150) % 3], 0.5 + 0.5 * k).strokeRect(F.x - 6, F.y - 6, F.w + 12, F.h + 12);
  }
  drawTimer(left) {
    const F = this.F, g = this.timerG, f = Math.max(0, left / ROUND_SEC);
    g.clear();
    g.fillStyle(0x3b4566).fillRoundedRect(F.x, F.y - 21, F.w, 16, 8);
    if (left <= 10 && Math.floor(this.time.now / 250) % 2) g.lineStyle(4, C.red, 1).strokeRoundedRect(F.x - 2, F.y - 23, F.w + 4, 20, 9);   // 마지막 10초 깜빡임
    g.fillStyle(f < 0.2 ? C.red : (f < 0.5 ? C.orange : C.green)).fillRoundedRect(F.x, F.y - 21, Math.max(16, F.w * f), 16, 8);
  }
  updateHud() {
    if (this.scoreText.text !== `⭐ ${RUN.score}`) { this.tweens.killTweensOf(this.scoreText); this.scoreText.setScale(1); this.tweens.add({ targets: this.scoreText, scale: { from: 1.35, to: 1 }, duration: 260, ease: 'Back.easeOut' }); }
    this.scoreText.setText(`⭐ ${RUN.score}`);
    const c = RUN.combo, sep = this.L.portrait ? ' ' : '\n';
    this.comboT.setText((c >= 2 ? `🔥${sep}${c} 콤보` : '') + (this.fever > 0 ? `${sep}×2 피버!` : ''));
  }
  endRound(reason) {
    if (this.ended) return;
    this.ended = true; this.state = 'end';
    this.wins.forEach(w => { if (w.pop && !w.pop.done) { w.pop.done = true; if (w.pop.fx) w.pop.fx.forEach(o => o.destroy()); hideShape(this, w.pop.view, false); } });
    sfx.win();
    banner(this, '⏱ 시간 끝!', '#1446a8', 76);
    let stars = RUN.caught >= STAR_RULE[1] ? 3 : (RUN.caught >= STAR_RULE[0] ? 2 : 1);
    RUN.stars = Math.max(1, stars - RUN.overloads);
    const msg = `⏱ 시간 끝! ${this.tw} ${RUN.caught}개를 잡았어요${RUN.ko ? ` (삐뚤이 KO ${RUN.ko}번!)` : ''}.`;
    this.updateHud();
    this.say(msg + (RUN.wrongList.length ? '\n🔍 이제 헷갈린 부품을 색연필로 다시 확인해요.' : ''), 'good');
    this.time.delayedCall(2600, () => this.scene.start('ReviewScene', { stage: this.stageIdx }));
  }
}

// 짧은 훈련: 진짜는 참고, 가짜는 톡!
class TutorialScene extends Phaser.Scene {
  constructor() { super('TutorialScene'); }
  create() {
    const W = this.scale.width, H = this.scale.height, L = whackLayout(W, H);
    drawBg(this);
    this.paused = false;
    topBar(this, '📖 탐정 훈련', L.top).prog.setText('연습');
    const F = L.portrait ? { x: 30, y: 300, w: 660, h: 420 } : { x: 150, y: 150, w: 980, h: 360 };
    this.wins = drawFacade(this, F, 3, 1, 0);
    this.wins.forEach((w, i) => this.add.zone(w.cx, w.cy, w.w, w.h).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.tap(i)));
    const b = buildBottom(this, L, false);
    this.say = b.say;
    // 건너뛰기: 위쪽 막대 안, 소리 버튼 왼쪽에 둔다 (게임 화면을 가리지 않게)
    const [bw, bh] = smallBtnSize(this);
    new Btn(this, W - 12 - bw * 2 - 16 - 90, L.top / 2, 180, bh, '건너뛰기 ▶▶', { fontSize: 22, onClick: () => this.scene.start('StageSelectScene') }).setDepth(11);
    this.nextBtn = new Btn(this, W / 2, L.portrait ? F.y + F.h + 90 : F.y + F.h + 30, 340, 70, '알겠어요 ▶', { fontSize: 28, fill: 0xffe08a, onClick: () => this.next() }).setDepth(20);
    this.step = 0;
    const real = makeQuestion('PARA', STAGES[0], { obvious: true, maxW: 7, maxH: 5 });
    this.wins[0].pop = { q: real, view: popShape(this, this.wins[0], real, true, true), done: false };
    this.say(`👋 ${GS.name} 탐정님! 창문에서 부품이 튀어나와요. 이건 진짜 평행사변형 — 마주 보는 두 쌍의 변이 모두 평행해요 (빨강 >, 파랑 >>). 진짜는 누르면 안 돼요!`);
  }
  update() { this.wins.forEach(w => { if (w.pop) w.pop.view.draw(); }); }
  next() {
    this.step++;
    if (this.step === 1) {
      this.nextBtn.setVisible(false);
      const fake = makeQuestion('TRAP', STAGES[0], { obvious: true, maxW: 7, maxH: 5 });
      const w = this.wins[2];
      w.pop = { q: fake, view: popShape(this, w, fake, true), done: false };
      sfx.pop();
      this.pulse = this.tweens.add({ targets: w.light, alpha: 0.4, duration: 400, yoyo: true, repeat: -1 });
      this.say('😈 이번엔 삐뚤이가 만든 가짜! 한 쌍만 평행하고, 다른 쌍은 늘이면 만나요. 가짜를 톡! 눌러서 잡아 보세요.');
    } else if (this.step >= 3) this.scene.start('StageSelectScene');
  }
  tap(i) {
    if (this.step === 0) return;
    const w = this.wins[i];
    if (this.step === 1 && i === 0) { sfx.buzz(); flashWin(this, w, false); this.say('앗, 그건 진짜예요! 진짜를 누르면 ❤️가 줄어요. 반짝이는 가짜를 눌러요.', 'bad'); return; }
    if (this.step !== 1 || i !== 2) return;
    this.step = 2;
    if (this.pulse) this.pulse.stop();
    w.light.setAlpha(1);
    const q = w.pop.q;
    catchFx(this, w);
    w.pop.view.answerMode = true;
    w.pop.view.extend([0, 1].filter(p => !q.pairs[p]).flatMap(p => PAIR_EDGES[p]), C.orange, 600);
    this.say('🎉 잡았다! 규칙: 60초 동안 가짜만 톡! 진짜를 누르거나 가짜를 놓치면 ❤️가 줄어요. 가짜 10개마다 삐뚤이 KO 보너스! 헷갈린 부품은 게임이 끝나고 색연필로 다시 확인해요.', 'good');
    this.nextBtn.setLabel('🗺️ 출동!').setVisible(true);
  }
}

// 게임이 끝나면 헷갈린 부품(최대 3개)을 색연필로 다시 확인한다
class ReviewScene extends Phaser.Scene {
  constructor() { super('ReviewScene'); }
  init(d) { this.stageIdx = (d && d.stage) || 0; }
  create() {
    // 같은 유형은 한 번씩, 최대 3개
    const seen = new Set(), list = [];
    RUN.wrongList.forEach(q => { if (!seen.has(q.type) && list.length < 3) { seen.add(q.type); list.push(q); } });
    RUN.wrongList.forEach(q => { if (!list.includes(q) && list.length < 3) list.push(q); });
    this.list = list;
    if (!list.length) { this.scene.start('ResultScene', { stage: this.stageIdx }); return; }
    const W = this.W = this.scale.width, H = this.scale.height, L = this.L = playLayout(W, H);
    drawBg(this);
    this.paused = false;
    const tb = topBar(this, '🔍 헷갈린 부품 다시 보기', L.top);
    this.progText = tb.prog; this.scoreText = tb.score; this.scoreText.setText(`⭐ ${RUN.score}`);
    const r = L.play, g = this.add.graphics();
    g.fillStyle(0xffffff, 0.85).fillRoundedRect(r.x, r.y, r.w, r.h, 22);
    g.lineStyle(4, C.ink, 0.22).strokeRoundedRect(r.x, r.y, r.w, r.h, 22);
    this.rect = { x: r.x + 14, y: r.y + 40, w: r.w - 28, h: r.h - 54 };
    this.tag = txt(this, r.x + 18, r.y + 10, '', 22, '#5b6787');
    const t = L.tools, pt = L.portrait, gap = 10;
    const defs = [
      { label: pt ? '🧽 지우개' : '🧽 지우개', act: () => this.erase() },
      { label: pt ? '🚫 평행 없음' : '🚫 평행한 변 없음', act: () => this.none() },
      { label: '✔ 확인하기', act: () => this.check(), main: true },
      { label: pt ? '결과로 ▶▶' : '결과 바로 보기 ▶▶', act: () => this.scene.start('ResultScene', { stage: this.stageIdx }) },
    ];
    this.btns = defs.map((d, i) => {
      const w = pt ? (t.w - gap) / 2 : t.w, h = pt ? 66 : (d.main ? 110 : 70);
      const x = pt ? t.x + (i % 2) * (w + gap) + w / 2 : t.x + w / 2;
      const y = pt ? t.y + Math.floor(i / 2) * (h + gap) + h / 2 : t.y + [35, 115, 230, 435][i];
      return new Btn(this, x, y, w, h, d.label, { fontSize: d.main ? 30 : 23, fill: d.main ? 0xffe08a : 0xffffff, onClick: d.act });
    });
    this.checkBtn = this.btns[2];
    const b = buildBottom(this, L, false);
    this.say = b.say;
    this.idx = 0;
    this.input.on('pointerdown', p => this.onPointer(p));
    this.show();
  }
  show() {
    const q = this.q = this.list[this.idx];
    if (this.view) this.view.destroy();
    this.view = new ShapeView(this, q, this.rect, { grid: false, circleFit: q.rot !== 0, maxUnit: 64 });
    this.declaredNone = false; this.curColor = 'red'; this.checked = false;
    this.checkBtn.setLabel('✔ 확인하기');
    this.btns[0].setEnabled(true); this.btns[1].setEnabled(true).setSelected(false);
    this.progText.setText(`${this.idx + 1}/${this.list.length}`);
    this.tag.setText(`${TYPE_INFO[q.type].name}`);
    this.say(`이 부품은 ${q.answer === 'real' ? '진짜 ✅' : '가짜 ❌'}였어요! 왜 그럴까요? 평행한 변 2개를 차례로 눌러 색연필로 칠해 보세요. (평행한 변이 하나도 없으면 🚫)`);
  }
  update() { if (this.view) this.view.draw(); }
  onPointer(p) {
    if (this.checked || this.paused || !this.view || !this.view.contains(p.x, p.y)) return;
    const e = this.view.edgeAt(p.x, p.y);
    if (e === null) return;
    const v = this.view;
    if (v.selected === null) { v.selected = e; sfx.mark(); this.say(`변 ${EDGE_NAMES[e]}을 골랐어요. 이 변과 평행한 짝 변을 눌러요!`); return; }
    if (v.selected === e) { v.selected = null; sfx.soft(); return; }
    const a = v.selected; v.selected = null;
    if ((a + e) % 2 === 1) { sfx.soft(); this.say('이웃한 변은 만나기 때문에 평행할 수 없어요! 마주 보는 변을 골라 보세요.'); return; }
    const pr = a % 2, col = this.curColor, other = col === 'red' ? 'blue' : 'red';
    v.marks[col] = pr;
    if (v.marks[other] === pr) v.marks[other] = null;
    if (v.marks[other] === null) this.curColor = other;
    this.declaredNone = false; this.btns[1].setSelected(false);
    sfx.pair();
    this.say(`${PAIR_NAMES[pr]}을 칠했어요! 다 칠했으면 ✔ 확인하기를 눌러요.`);
  }
  erase() { if (this.checked) return; this.view.marks = { red: null, blue: null }; this.view.selected = null; this.curColor = 'red'; this.declaredNone = false; this.btns[1].setSelected(false); }
  none() { if (this.checked) return; this.erase(); this.declaredNone = true; this.btns[1].setSelected(true); this.say('🚫 평행한 변이 하나도 없다고 표시했어요. ✔ 확인하기를 눌러요.'); }
  check() {
    if (this.checked) { this.idx++; if (this.idx >= this.list.length) this.scene.start('ResultScene', { stage: this.stageIdx }); else this.show(); return; }
    const q = this.q, v = this.view;
    const marked = this.declaredNone ? [] : [...new Set(['red', 'blue'].map(c => v.marks[c]).filter(x => x !== null))];
    if (!marked.length && !this.declaredNone) { sfx.soft(); this.say('🖍️ 먼저 평행한 변을 색연필로 칠해 보세요! (하나도 없으면 🚫)'); return; }
    const ok = [0, 1].every(p => q.pairs[p] === marked.includes(p));
    this.checked = true;
    this.btns[0].setEnabled(false); this.btns[1].setEnabled(false);
    v.selected = null; v.answerMode = true;
    v.extend([0, 1].filter(p => !q.pairs[p]).flatMap(p => PAIR_EDGES[p]), C.orange, 900);
    if (ok) { sfx.ding(); RUN.score += 50; this.scoreText.setText(`⭐ ${RUN.score}`); floatText(this, this.W / 2, this.rect.y + 60, '+50 복습 보너스'); }
    else { sfx.buzz(); this.cameras.main.shake(200, 0.005); }
    this.say((ok ? '⭕ 맞아요! ' : '❌ 정답과 비교해 봐요. ') + explain(q), ok ? 'good' : 'bad');
    this.checkBtn.setLabel(this.idx < this.list.length - 1 ? '다음 ▶' : '📊 결과 보기 ▶');
  }
}

    txt(this, ix, ty + 44, `이번 도전 ${total}점 · ★ ${stars}/${STAGES.length * 3}`, 28, '#b8860b').setOrigin(0.5);
    txt(this, ix, ty + 80, `🏆 최고 기록 합계 ${sumOf('best')}점`, 22, '#5b6787').setOrigin(0.5);
    const qBox = txt(this, ix, ty + (pt ? 112 : 118), '💬 내가 설계한 미래 건물의 창문에도\n진짜 평행사변형을 썼나요?\n마주 보는 두 쌍의 변이 평행한지 확인해 봐요!', 24, C.inkS,
      { align: 'center', lineSpacing: 6, backgroundColor: '#ffffffcc', padding: { x: 18, y: 12 } }).setOrigin(0.5, 0);
    if (!pt) makePara(this, 1170, 470, 0.7);
    const by = pt ? 1215 : 650;
    new Btn(this, ix - 160, by, 290, 76, '🗺️ 도시 지도로', { fontSize: 26, onClick: () => this.scene.start('StageSelectScene') });
    new Btn(this, ix + 160, by, 290, 76, '🔄 처음부터 재도전', { fontSize: 24, onClick: () => {
      restartRun();   // 층·별은 처음부터, 최고 기록은 그대로
      this.scene.start('StageSelectScene', { retry: true });
    } });
    if (qBox && all) sfx.win();
    // 색종이
    const cols = [C.red, C.blue, C.yellow, C.green, 0xb48cff];
    for (let i = 0; i < (all ? 70 : 30); i++) {
      const r = this.add.rectangle(ri(0, W), ri(-H, -20), ri(8, 14), ri(12, 20), pick(cols)).setDepth(100).setAngle(ri(0, 360));
      this.tweens.add({ targets: r, y: H + 40, angle: r.angle + ri(180, 720), x: r.x + ri(-80, 80), duration: ri(3000, 6000), delay: ri(0, 3000), repeat: -1 });
    }
  }
}

/* =====================================================================
   ⑤ 게임 실행
   ===================================================================== */
const wantPortrait = () => window.innerHeight > window.innerWidth * 1.05;
let started = false;   // 타이틀을 지나 게임을 시작했는지
// 태블릿을 돌려 가로/세로가 바뀌면 그 방향에 맞는 화면 배치로 다시 만든다 (진행 기록은 유지)
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!window.game || wantPortrait() === (window.game.scale.height > window.game.scale.width)) return;
    const active = window.game.scene.getScenes(true)[0];
    const key = active ? active.scene.key : 'TitleScene';
    window.game.destroy(true);
    startGame(['TitleScene', 'StoryScene', 'TutorialScene', 'EndingScene'].includes(key) ? key : (started ? 'StageSelectScene' : 'TitleScene'));
  }, 400);
});
function startGame(firstKey = 'TitleScene') {
  BootScene.firstKey = firstKey;
  const portrait = wantPortrait();
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#d9f1ff',
    width: portrait ? 720 : 1280,
    height: portrait ? 1280 : 720,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    dom: { createContainer: true },
    scene: [BootScene, TitleScene, StoryScene, TutorialScene, StageSelectScene, PlayScene, ReviewScene, ResultScene, EndingScene],
  });
}
(function boot() {
  if (typeof Phaser === 'undefined') {
    document.getElementById('loading').textContent = '⚠️ 게임 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    return;
  }
  // 한글 웹폰트는 글자 묶음별로 나뉘어 있으므로, 게임에 쓰인 모든 글자를 미리 불러온다
  const allText = document.getElementById('gamecode').textContent.replace(/[\x00-\x7F]/g, '');
  const ready = (document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('30px "Jua"', allText + '가나다ABC123'), new Promise(r => setTimeout(r, 3000))])
    : Promise.resolve();
  ready.then(() => startGame(), () => startGame());
})();
</script>
